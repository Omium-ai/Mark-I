# Outside the workspace ([workspace.exclude]): cargo-fuzz needs nightly and its
# own profiles, so versions are named outright — otel_gate.sh scans this
# manifest directly since cargo-deny's graph never reaches it.
[package]
name = "mark1-redact-fuzz"
version = "0.0.0"
publish = false
edition = "2021"

[package.metadata]
cargo-fuzz = true

# Empty table = standalone root: without it, cargo run from inside this dir
# walks up, finds the workspace that excludes it, and refuses the package.
[workspace]

[dependencies]
libfuzzer-sys = "0.4"
mark1-redact = { path = ".." }

# Target name `admit` is load-bearing: `just fuzz` runs `cargo +nightly fuzz run admit`.
[[bin]]
name = "admit"
path = "fuzz_targets/admit.rs"
test = false
doc = false
bench = false
