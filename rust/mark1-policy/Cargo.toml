[package]
name = "mark1-policy"
version.workspace = true
edition.workspace = true
license.workspace = true
# UNLICENSED is proprietary AND is not a valid SPDX expression. `publish = false` is what makes
# that non-negotiable: it stops `cargo publish` in the wrong directory (crates.io is append-only
# -- yank hides, it does not delete) and it is the condition cargo-deny's `private.ignore` keys
# off, so the licence gate can pass on our own crates without weakening it for dependencies.
publish = false
authors.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[dependencies]
mark1-receipt = { workspace = true }     # KeyRing/KeyEntry + Ed25519 verify: one signing discipline product-wide (04 §7.2)
ciborium = { workspace = true }          # PolicyBundle CBOR decode; the canonical-form check re-encodes and byte-compares
# sha2, not blake3: 07's CDDL fixes prev_hash as "SHA-256 of the previous bundle's canonical
# bytes" and 05 §4.4 fixes tlog leaves as SHA-256(bundle canonical bytes). (This manifest used
# to name blake3 for both — that comment contradicted 07/05 and the docs win.)
sha2 = { workspace = true }
# NO regex: decode.rs deliberately hand-rolls the CDDL productions as byte
# predicates (no fallible pattern-compile step to launder through a denied
# `expect` in static init) — a declared-but-unused regex here only pretended
# otherwise.
thiserror = { workspace = true }         # Reject carries M1E-3001/3002/3003/3005

[dev-dependencies]
proptest = { workspace = true }
serde_json = { workspace = true }        # conformance manifest driving (conf_vectors_bundle)
anyhow = { workspace = true }            # examples/gen_bundle_vectors error plumbing (workspace lints deny unwrap/expect)
