[package]
name = "mark1-harden"
version.workspace = true
edition.workspace = true
license.workspace = true
# UNLICENSED is proprietary AND is not a valid SPDX expression. `publish = false` is what makes
# that non-negotiable: it stops `cargo publish` in the wrong directory (crates.io is append-only
# -- yank hides, it does not delete) and it is the condition cargo-deny's `private.ignore` keys
# off, so the licence gate can pass on our own crates without weakening it for dependencies.
publish = false
authors.workspace = true
rust-version.workspace = true

[lints]
workspace = true

# Platform crates only. This crate sits in BOTH reviewed closures of
# tools/ci/tokenpath_deps_gate.sh (the shim's hook path and the proxy's token path); libc and
# windows-sys were already in each, so the only new line in either list is this crate itself.
[target.'cfg(unix)'.dependencies]
libc = { workspace = true }

[target.'cfg(windows)'.dependencies]
# + Threading/Authorization: the process-token SID behind 07 §5's pipe name (pipe.rs). Features, not crates.
windows-sys = { workspace = true, features = ["Win32_System_Threading", "Win32_Security_Authorization"] }

[dev-dependencies]
tempfile = { workspace = true }
