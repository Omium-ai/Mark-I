# golangci-lint v2 config — one file at repo root, all three modules run it (§6.2 lint-go).
version: "2"

# Without this the seven `//go:build integration` suites are invisible to every linter — tagging
# a file to route it into `just test-integration` would silently also route it out of the lint
# gate. They are clean today, which is exactly when to turn this on: the cost is zero now and
# the alternative is discovering an unlinted corner later, after it has grown one.
run:
  build-tags:
    - integration

linters:
  default: none
  enable:
    - errcheck        # an ignored error on the spool/uplink path is silent data loss
    - govet
    - staticcheck
    - ineffassign
    - unused
    - gosec           # G-series: exec, file perms, weak crypto
    - depguard        # the mechanical import-boundary gate — rules below
    - forbidigo       # no fmt.Print* outside cmd/ (edge logs via obs or not at all)
  settings:
    depguard:
      rules:
        no-otel:
          deny:
            - pkg: "go.opentelemetry.io"
              desc: "Mark 1 has zero OpenTelemetry (CON-005 / ADR-0005). Telemetry rides M1P."
        clickhouse-choke:
          files:
            - "!**/internal/querychoke/**"
            - "!**/internal/ingest/chproj/**"
          deny:
            - pkg: "github.com/ClickHouse/clickhouse-go"
              desc: "ClickHouse is reachable ONLY through controld.querychoke (05 §6); chproj projects rows for ingest."
        no-grpc:
          deny:
            - pkg: "google.golang.org/grpc"
              desc: "No gRPC in Mark 1 — M1P is plain HTTPS; the fabric is M1PL."
    gosec:
      excludes:
        - G304   # file inclusion via variable — tailers/spool open computed paths by design, behind WorkspaceSet
    forbidigo:
      forbid:
        - pattern: "^fmt\\.Print"
  exclusions:
    rules:
      - path: _test\.go
        linters: [gosec, forbidigo]

# Defaults are 50 per linter and 3 per identical message, and the truncation is SILENT: a
# module with 30 identical `resp.Body.Close` findings reports 3, and fixing those three
# reveals three more. Every count this gate produced was an undercount, so "the lane is
# nearly clear" was never a statement anyone could make from its output. A gate that
# under-reports its own findings is the same failure class as one that passes by never
# running — 12 §0.3. Unbounded, both here and for anyone running it locally.
issues:
  max-issues-per-linter: 0
  max-same-issues: 0

formatters:
  enable:
    - gofmt
    - goimports
