  FR-SPINE-005: [rust:missing_or_wrong_bearer_is_401_m1e1002, rust:wrong_host_is_403_m1e4004, rust:any_origin_is_403_m1e4005, rust:loose_store_or_discovery_modes_are_refused, go:TestLoopbackRequiresSessionBearer, go:TestLoopbackRejectsNonLiteralHost, go:TestLoopbackRejectsForeignOrigin, go:TestLoopbackBindsLoopbackOnly, "partial:the mark1d loopback door now exists -- go/mark1d/internal/fabric/loopback.go serves POST /m1pl over its own 127.0.0.1:0 listener and applies the three 08 4.5 walls in declared order before the route match and before any body byte is read. The four rust: entries above prove cortexds MCP listener, a different door, and are retained as the Rust half of the same contract. Each Go wall is pinned by a lead-verified mutation: deleting the Host check turns all 9 subtests red (rebind names, bare literal, wrong port, [::1], octal and dotted-decimal spellings); downgrading the Origin check from map presence to a Header.Get non-empty test reds the present-but-empty subtest, which is exactly what a sandboxed or file:// page sends; binding 0.0.0.0 instead of 127.0.0.1 reds TestLoopbackBindsLoopbackOnly with bound ::. CORRECTION: an earlier wording said Server.Serve already accepting any net.Listener makes this row listener-sized. True of the TYPE, false of the BUILD -- handing Serve a TCP listener yields M1PL-over-TCP, a binary framed stream carrying no Host, Origin or Authorization header anywhere, which is precisely the unauthenticated localhost fallback 02:77 forbids; 08 4.5 specifies HTTP. Still owed: the 0600 loopback.json discovery file this rows own text names, per-session token issuance (one per-boot token today), POST /m1pl/gate (blocked on that issuance -- Gate.Answer needs an authenticated session id and the all-zero sentinel is what D-AT/D-AL refuse), the 429 M1E-9001 cap, GuardDecision emission for the 4004/4005 security-event column, and the cmd/main.go wiring, so nothing constructs the listener yet"]  # P0, Phase 1, negative
  FR-SPINE-006: [go:TestSpoolRoundTripAndOnDiskBytes, go:TestCorruptRecordIsDetectedAndAccounted, go:TestCloseDrainsPendingAppends, go:TestDiskHardStopBoundaryIsNinetyFivePercent, go:TestDiskHardStop, go:TestCrashRecoveryTruncationSweep, go:TestDefaultSegmentAndCapSizes, go:FuzzSpoolRecordDecode, go:TestEndToEndRecoveryScan]  # P0, Phase 1, unit + fuzz. The struck partial was stale twice over: the hard stop had been implemented (platform_unix.go diskUsedRatio, deliberately on st.Bavail so root-reserved blocks are not ours to spend) and TestDiskHardStop already drove it. What was genuinely unproven was narrower and worse. "Corrupt crc32c detected" had NO test reaching the CRC branch at all -- the truncation sweep's ~500 cuts trip the length checks first and the fuzz target returns on rejection, so disabling the crc compare left the whole package green. "Drain on shutdown" was masked by recovery: scanForward finds the records whether or not Close synced, so the drain could be deleted invisibly. And the boundary itself was only ever sampled at 99%, so the 95% in the requirement was a number no test knew. Each is now pinned at the level the mutation can be seen -- the corrupt record is a diagnostic among billing neighbours so its accounted class must come from byte [16] rather than from a guess, and the drain is asserted on the published ledger slot rather than on what a subsequent read happens to recover.
