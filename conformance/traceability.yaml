  NFR-DURABILITY-004: [go:TestAdaptiveFsyncCadence, go:TestEndToEndRecoveryScan, go:TestOffSkipsUploadHalfOfDrain, rust:session_end_forces_a_flush_after_the_event_and_awaits_the_ack, rust:session_end_flush_unacked_returns_within_deadline_and_is_counted, go:TestFlushAckFollowsTheSpoolFsync, "partial:SessionEnd-forces-drain is built on both ends. Shim: on SessionEnd one connection carries Hello, the event, then Flush, and awaits FlushAck within 1490 ms (the vendors 1.5 s hook budget less 08 s4.4s 10 ms margin -- a judgement call, s4.4 has no Flush row); timeout or refusal spills and counts hookshim.flush_timeout; a lead mutation swapping Flush ahead of the event reds. Daemon: the Flush arm (fabric/session.go:196-206) calls the spools own Sync -- fsync plus ledger publish, no second fsync path -- BEFORE writing the ack, and a failed sync writes no ack and closes the connection so the shim spills and replays at-least-once; TestFlushAckFollowsTheSpoolFsync parks the cadence so only Flush can sync, admits three, and asserts Drained==3 AND all three sit below the durable cursor, then injects a sync failure and asserts EOF with no ack byte. Lead mutation leaving the nil-check but never calling sync reds with FlushAck arrived with 0 of 3 records below the durable cursor. CEILING, same shape as M20: srv.Sync = sp.Sync at cmd/main.go:531 is one deletable line -- lead deleted it and the whole cmd suite stayed green, because no cmd-level test can read the daemons durable cursor while it holds the spool. The fsync-cadence clause (250-500 ms observed) remains covered only by TestAdaptiveFsyncCadence"]  # P1, Phase 1, unit
