  CON-012: [go:TestStartTailWorkspaceGate, go:TestMungeCollisionForeignWorkspaceNeverEmits, go:TestStartTailFollowsDerivedDir, go:TestMark1IgnoredStreamNeverEmits, go:TestMark1IgnoreWrittenMidSessionStopsStream, go:TestIgnoreRefusesUnsupportedConstructs, go:TestIgnoreUnreadableFailsClosed, go:TestReportGuaranteeGradeRefusal, py:test_floor_refusal_is_m1e_5004, "partial:.mark1ignore excludes whole transcript streams by cwd; per-repo-file-path scrubbing inside event payloads is unbuilt -- tailers emit only Usage, which has no path field, so that half belongs to capture/hookshim and cortexd"]  # P0, Phase 1, negative. The partial was accurate and .mark1ignore is now built, but the requirement had two readings and only one is reachable from this package. 04 §2.1 defines WorkspaceSet as "canonicalized enabled roots + .mark1ignore, consulted on every file DISCOVERY" -- the ignore layer is part of the same Allowed() oracle, not an event-payload filter -- and stream.go:161-184 builds only m1pv1.Usage, which carries message/request id, model, four token counts and service tier and no path-shaped field at all. So the reading this row can close is whole-stream exclusion by declared cwd; the payload-scrubbing reading is not merely untested here, it is unreachable from a package that never handles a repo path. The matcher is a hand-rolled documented subset (comments, dir/, leading /, embedded / anchoring, basename-at-any-depth, * and ? within a segment, ** across) that REFUSES negation, character classes and escapes rather than misreading them, which is the one deliberate divergence from the cortexd matcher it was ported from: cortexd silently drops `!` lines, and both read less than git but only this one says so. Unreadable or unparseable means the whole root is excluded, because "ignore nothing" is precisely the silent widening the constraint exists to stop -- a customer writing [Pp]rivate/ must not get a tailer that read it anyway -- and a failed load is never cached, since repairing permissions or syntax moves neither mtime nor size and a latched failure would stay dark. Two root-cause fixes came out of it rather than the narrow one: LiveSet.SetRoots had its own canonicalization path, so the RUNNING daemon would have had no ignore layer whatever the constructor did, and Manager.revoke() now re-asks the oracle for already-open streams each sweep and drops rather than flushes their pending Usage, because admission had been a one-time grant while 04 §2.1 says "not just once".
