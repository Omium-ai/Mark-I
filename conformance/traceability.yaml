ile-checked for Windows -- the Windows verdict is the go (windows-2022) leg on the next push. (1) capture was DEAD there: tailers/fileid_windows.go unconditionally returned no identity and newTailer refuses to construct without one, so every stream logged open failed and four tests saw zero events; now GetFileInformationByHandle (volume serial plus file index) with rotation via os.SameFile on both platforms. (2) the munge, see CON-012. (3) spool.Open leaked the ledger fd on a REFUSED boot on every platform (recover opens it before Open can fail; only lock was closed) -- proven with a /proc/self/fd probe on Linux, one descriptor per refused Open; Windows additionally pinned the file against RemoveAll. (4) the Windows single-writer lock byte at offset 0 overlapped the pid text lockDir writes at offset 0, and Windows byte-range locks are mandatory per-handle, so the loser could never read the holder pid; the lock byte is now at 1<<20. (5) the fakeClaude fixture was a sh script; now claude.cmd on windows, the same PATHEXT route Detect takes for npm. Skipped on windows with the requirement named: POSIX mode asserts (NFR-SECURITY-007 -- owner-only on Windows is an ACL nothing sets), the read-only-dir and chmod-0 fixtures (unconstructible there; production paths are platform-neutral). Named, not fixed: Go os.Open lacks FILE_SHARE_DELETE, so a held transcript cannot be renamed or deleted on Windows -- rotation is unreachable AND the vendors retention sweep cannot delete a transcript mark1d is tailing; needs a CreateFile open with share-delete. openSegmentLocked no longer leaks its new f when the header write or fsync fails (spool.go:641-651, one error path that closes first; no injection seam exists for a write failure on a fresh fd, so this one has no test). TestRefusedOpenLeaksNoDescriptor is the permanent form of the /proc/self/fd probe, with two subtests because the lock-refusal path never reaches recover -- only the recovery-refusal subtest reds when Open goes back to closing just the lock, which is why both are there"]  # P0, Phase 1, conformance
