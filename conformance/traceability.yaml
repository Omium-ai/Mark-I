  FR-SPINE-003: [go:TestReplayStreams, go:TestReplayOvercount, go:TestReplayManager, go:TestDeriveUsageIdemKeyPerTenant, go:TestUsageIdemKeyIsolatesTenants, go:TestDeriveUsageIdemKeyGoldenVector]  # P0, Phase 1, conformance. The third clause ("HMAC keyed per tenant") is the one the replay suite structurally could not reach: those tests inject a testIdemKey stand-in, so they are key-AGNOSTIC by construction and stay green under a derivation that ignores the tenant root entirely. The clause is a privacy promise before it is a dedupe one -- 07 §7 upserts Usage on idem_key ALONE, so two tenants deriving one key for the same (session, message.id, request_id) triple fuses two organisations' ledgers. It is now proven at two levels because each catches what the other cannot: TestDeriveUsageIdemKeyPerTenant drives DeriveUsageIdemKey directly, while TestUsageIdemKeyIsolatesTenants replays the committed corpus through stream.consume/flush under two roots, which is the only one of the two that sees a break in IdemKey's HMAC construction downstream of a correct derivation. TestDeriveUsageIdemKeyGoldenVector freezes the HKDF label: a label change keeps keys 32 bytes, per-tenant and deterministic, so every behavioural test in the package survives it while every already-uploaded idem_key stops matching -- a wire break invisible to everything else.
