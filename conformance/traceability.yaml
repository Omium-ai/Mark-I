  FR-SPINE-008: [go:TestIngestRequestShape, go:TestReplayedBatchAcks200WithoutDuplicateSideEffects, go:TestBatchIDReuseWithDifferentBytesIs409, go:TestIntegrationProjectAndReplayDedupe, go:TestNoModuleDependsOnGRPC, go:TestNoFirstPartyGoSourceImportsGRPC, go:TestNoProtoDeclaresAService, go:TestNoRustCrateIsAGRPCStack, go:TestGRPCScannerAcceptsWhatMark1ActuallyShips]  # P0, Phase 1, conformance. <prose: the never-gRPC clause is now asserted at four independent layers, because any one of them alone is evadable: the Go module graph (a transitive grpc dependency cannot enter go.sum unnoticed), first-party Go imports (a vendored or replace-directive grpc would pass the module check), .proto service declarations (a service block is how a gRPC surface actually gets born, and buf would happily generate it), and the Rust crate manifests (tonic/tonic-build/hyper-as-a-grpc-stack). The fifth test is the positive control and is the one that matters most: an absence assertion is ALSO what a scanner that reads nothing reports, so it feeds the scanner the shapes Mark 1 genuinely ships -- connectrpc-free HTTP handlers, the committed prost output, buf.gen.yaml -- and fails if any is misread as gRPC. The partial's premise was incomplete rather than wrong: .golangci.yml:37-40 does carry an enforced depguard no-grpc rule and deny.toml:41 bans tonic. Neither is a test, neither reads a module graph, and neither scans a .proto -- and depguard's deny list names exactly one package, so connectrpc.com/connect walks past it. See D-DU>
  FR-SPINE-009: [go:TestBackoffOn5xxThenSuccess, go:TestRetryAfterIsAFloor, go:TestBackoffLadderIsCappedAtThirtyMinutes, go:TestBackoffDrawsFullJitterOverTheCappedExponential, go:TestTornConnectionIsRetriedNeverQuarantined, go:TestUnreachableEndpointExhaustsBudgetThenParks, go:TestParkAfterBudgetThenRequeueSucceeds, go:TestRunRequeuesParkedWorkOnNetworkChange, go:TestQuarantineOn4xxNeverRetried, go:TestMiddlebox200WithoutBatchIDEchoIsRetriedNotAcked, go:TestRedirectIsRefusedAndRetriedNeverAcked]  # P0, Phase 1, chaos. Both clauses the partial named are now closed, and closing the first one surfaced a finding carried in docs/RECONCILIATION.md rather than here: the min(exp, 30m) clamp is UNREACHABLE through the wire path, because maxAttempts=10 parks without sleeping, so the longest delay the uploader can ever request is attempt 9 = 25m36s and the unclamped ladder first crosses 30m at attempt 10. The clamp is therefore asserted white-box at u.backoff(n) over n=1..12 -- three rungs past the cap, 30m against an unclamped 51m12s/1h42m/3h25m -- while the ladder itself is asserted through the wire at Rand=1.0 (the jitter ceiling, the only draw at which a clamp is visible) against durations captured from the After seam, not sleep counts. The jitter test is separately load-bearing: dropping the rand multiplier leaves the ladder test green. Transport failure is now injected twice at different layers, because they fail differently -- panic(http.ErrAbortHandler) kills the connection after the request is accepted and with no status line, while a POST to a closed loopback port never speaks HTTP at all; both must retry and neither may quarantine, since quarantine is the 4xx verdict and a torn socket is not a verdict.. <prose: 2026-09-15 vacuity review, recorded not fixed: the 30-minute cap is proven by TestBackoffLadderIsCappedAtThirtyMinutes calling u.backoff(n) directly for n=1..12, not by the fault-injected observed ladder the criterion literally describes -- and the wire can n