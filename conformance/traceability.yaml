  NFR-PORTABILITY-001: [gate:tools/ci/ci_matrix_gate.sh, gate:.github/workflows/ci.yml]  # P0, Phase 1, conformance. The gate parses ci.yml and asserts: it triggers on pull_request; every job running an edge recipe (build/lint/test go+rust) carries all three OSes with fail-fast off; every required-check name is a check the workflow really reports; and every job is required or reached through a required job's `needs`. It found the live defect -- `rust` and `go` were listed as required checks while both are matrix jobs reporting only `rust (ubuntu-24.04)` and friends, so neither name had ever been satisfiable. `platform-gate` now aggregates the six legs under one stable name. Whether GitHub's branch protection actually requires that name is a settings-page fact no in-repo artifact can read; it is a row comment rather than a `partial:` because a clause that can never be closed in-repo is how a row goes permanently red (D-CO).
