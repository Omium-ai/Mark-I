  CON-008: [go:TestRedactSubstitutionPreSpool, go:TestRedactEventSubstitutesStringFields, rust:spill_roundtrip_redacts_before_sealing, rust:tests::prop_redact_no_secret_survives, rust:tee::spill::tests::sealed_record_is_framed_and_contains_no_plaintext, go:TestQuarantineFailClosed, go:TestAdmitQuarantineOnPanic, go:TestScannerHitQuarantinesWholeBatchNeverStrips, rust:admit_axis_has_no_off_switch, rust:cargo_manifest_declares_no_features, rust:checker_flags_a_planted_off_switch, rust:empty_or_wrong_directory_is_not_a_pass, rust:admit_guards_every_spill_write, rust:caller_crates_have_no_unreviewed_byte_sink, rust:caller_checker_flags_planted_regressions, rust:widened_reviewed_sink_is_named, rust:sink_shapes_are_recognised_or_refused, rust:sink_inside_loop_or_closure_refuses_domination, "partial:the no-off-switch clause now regresses loudly, but only within mark1-redact's own source tree. The absence is asserted over rust/mark1-redact/src/ (zero environment reads, no conditional compilation but #[cfg(test)], Scanner's public surface exactly new/scan/admit with no public fields or trait impls) and over the crate manifest (no [features] table, no optional dependency), with a positive control that plants an env read, a feature gate and an extra constructor and confirms each is named. Verified by the lead rather than taken on report: planting a compiling env bypass at lib.rs:268 fires the exact diagnostic, and the 15 pre-existing lib tests all stay GREEN under that live bypass -- which measures the gap this closes. The callers are covered now too: the checker walks mark1-proxy and mark1-hookshim and asserts every byte sink on a spill path is either preceded by an admit() call in the same body or named in REVIEWED_SINKS, with a positive control that plants a regression in each crate. Also lead-verified rather than taken on report: deleting the admit() call at mark1-proxy/src/tee/spill.rs:41 leaves all 59 mark1-proxy tests GREEN and reds only this gate, naming the file and the invariant. The three ceilings that stood here are now closed or narrowed. REVIEWED_SINKS pins each reviewed sinks file, fn AND a fingerprint of its code plus literals (comments blanked), so widening a reviewed sink in place reds the gate -- lead-verified on the REAL proxy, not a scratch copy: changing spill.rs:69 from write_all(sealed) to write_all(frame), i.e. persisting the pre-seal bytes, reds with append was edited since its CON-008 review naming both fingerprints; a comment edit does not move the pin. io::copy, to_writer, BufWriter, Command stdout redirect and mmap are recognised sinks subject to admit-precedes or the allowlist, and ten further write-like names (persist, rename, sendfile, splice, ...) fail CLOSED as unrecognised sink shape rather than pass unseen. A sink inside a closure or async block, or any loop in a guarded body, refuses with cannot establish domination. What remains: the sink model is a name list, so an emitting method with an unlisted name (a socket send, a custom emit) is still invisible and tracing macros are out of model; the walk reads pre-expansion source; a re-exported env helper reads as an ordinary path; and the table and its hashes can be widened in the same commit, so this forces review rather than preventing it"]  # P0, Phase 1, negative
