# Requirement -> test traceability (12 §10.2). Enforced by tools/trace-check.
#
# One entry per requirement ID in 02 §9, all 181, in document order. Phase,
# priority and verification category are NOT repeated here -- trace-check reads
# them from 02 so there is exactly one place they can be wrong.
#
# Evidence grammar: go:Test | py:test | rust:path::to::test | fuzz:crate/target
#                   manual:docs/NN.md#anchor | partial:unproven-clause | gap:reason
#
# `gap:` and `partial:` are evidence-shaped on purpose: a requirement with nothing
# behind it is a line that says so, not an empty list that reads as an oversight.
#
# `partial:` is the one that matters. 02 §9's acceptance criteria are multi-clause,
# and the requirement with a passing test for clause one and no code at all for
# clause two is the one that reads green while the promise is unbuilt. It carries
# its real citations AND names what they do not cover, and it counts as unproven.
# Anything less makes this file an alibi instead of a gate.

# Requirements at or below this phase must carry real evidence; above it, a gap is
# reported and not fatal. Raising this number is how a phase gets armed.
current_phase: 1

requirements:
  CON-001: [rust:guard_no_forward_path, rust:guard::provenance::tests::unit_guard_state_machine, rust:guard::provenance::tests::unverifiable_guard_refuses_everything, rust:guard::provenance::tests::neg_no_classifier_override_in_binary, rust:guard_contamination_killpath, rust:a_kill_survives_a_proxy_restart, rust:only_enrolling_a_different_credential_lifts_a_kill, rust:off_marker_is_not_an_override_path, gate:tools/ci/override_pattern_gate.sh, go:TestContaminationIsAdmittedAsAGuardDecision, go:TestCheckpointSealsExactlyTheAckedBatch, go:TestSealVerifiesAsControldWould, "partial:the receipted `oauth_contamination` clause only, and what remains of it is now one server-side column rather than a missing producer. The P0 is admitted as a GuardDecision (cmd/main.go record(), read back out of the spool rather than trusting the handler's own log line), every event in a batch controld VERIFIABLY landed becomes a Merkle leaf of a device-signed ReceiptCheckpoint, and that checkpoint verifies exactly as controld verifies it -- so the refusal now carries chain evidence end to end. What it does NOT yet have is its own receipt: 07 §11 names guard_contamination as a per-event class keyed on subject_id = this event's event_id, and no code mints one. The P0 inherits its evidence by riding a checkpoint's leaf set, and since inclusion_path is not persisted server-side (FR-SPINE-015), nothing can hand an auditor the proof path for that single event without rebuilding the tree from the batch"]  # P0, Phase 3, negative. neg_no_classifier_override_in_binary is a RUNTIME sweep, not a source grep: 96 cases over sampling configs (including a struct literal that bypasses the clamp), four Guard construction paths, MARK1_DISABLE on and off, with a checked-count assertion so a refactor cannot silently shrink it. It is the only test in the crate that caught a planted refusal which returned the right verdict while recording an HMAC of the subscription token.
