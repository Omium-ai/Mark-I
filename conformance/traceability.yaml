# Requirement -> test traceability (12 §10.2). Enforced by tools/trace-check.
#
# One entry per requirement ID in 02 §9, all 181, in document order. Phase,
# priority and verification category are NOT repeated here -- trace-check reads
# them from 02 so there is exactly one place they can be wrong.
#
# Evidence grammar: go:Test | py:test | rust:path::to::test | fuzz:crate/target
#                   manual:docs/NN.md#anchor | partial:unproven-clause | gap:reason
#
# `gap:` and `partial:` are evidence-shaped on purpose: a requirement with nothing
# behind it is a line that says so, not an empty list that reads as an oversight.
#
# `partial:` is the one that matters. 02 §9's acceptance criteria are multi-clause,
# and the requirement with a passing test for clause one and no code at all for
# clause two is the one that reads green while the promise is unbuilt. It carries
# its real citations AND names what they do not cover, and it counts as unproven.
# Anything less makes this file an alibi instead of a gate.

# Requirements at or below this phase must carry real evidence; above it, a gap is
# reported and not fatal. Raising this number is how a phase gets armed.
