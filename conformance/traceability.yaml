ll. So the reading this row can close is whole-stream exclusion by declared cwd; the payload-scrubbing reading is not merely untested here, it is unreachable from a package that never handles a repo path. The matcher is a hand-rolled documented subset (comments, dir/, leading /, embedded / anchoring, basename-at-any-depth, * and ? within a segment, ** across) that REFUSES negation, character classes and escapes rather than misreading them, which is the one deliberate divergence from the cortexd matcher it was ported from: cortexd silently drops `!` lines, and both read less than git but only this one says so. Unreadable or unparseable means the whole root is excluded, because "ignore nothing" is precisely the silent widening the constraint exists to stop -- a customer writing [Pp]rivate/ must not get a tailer that read it anyway -- and a failed load is never cached, since repairing permissions or syntax moves neither mtime nor size and a latched failure would stay dark. Two root-cause fixes came out of it rather than the narrow one: LiveSet.SetRoots had its own canonicalization path, so the RUNNING daemon would have had no ignore layer whatever the constructor did, and Manager.revoke() now re-asks the oracle for already-open streams each sweep and drops rather than flushes their pending Usage, because admission had been a one-time grant while 04 §2.1 says "not just once".
