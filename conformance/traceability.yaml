as field 1, and artifacts.proto:190-200 is an explicit design statement rather than an omission: inclusion proofs live on the SERVER side BY INTENT, in the checkpoint_seq/inclusion_path columns of mark1.m1p_events and m1_receipts.inclusion_path + leaf_index, served by GET /api/v1/receipts/inclusion/{event_id} (08:353), and there is deliberately no wire field because an event carrying its own claimed proof would assert the very thing the verifier must recompute. What is genuinely absent is the LEAF LIST and only that. The columns already exist on both sides (m1_002:92-93 bytea and nullable under the CHECK at :131, m1_ch_001_events.sql:108 String), the pure function exists twice (mark1d identity/merkle.go:77, controld receipts/merkle.go:81) with zero production callers in either module -- in each the only callers are conf_vectors_test.go -- and the verifier already rejects a bad path (receipts/chain.go:267 DefectInclusionPathInvalid). So what is missing is a PRODUCER. The obstacle is a design decision, not a contract gap: the checkpoint's leaf set is not the batch's event set, because sealer.go:168 prepends leaves retained from an earlier refused seal so one checkpoint can span two uploads, and sealer.go:283-292 declines to seal a batch that is entirely our own checkpoints. But the reconstruction is UNIQUELY DETERMINED rather than a search: sealer.go:243-248 states the invariant that every leaf appears under exactly one root, leaves are consumed strictly in arrival order, and leaf_count pins the set size -- so the candidate is the oldest leaf_count not-yet-assigned event_ids for that device in arrival order, and sidefx.go:111-114 already materialises that per-batch ordered list in spool order, explicitly mirroring sealer.go:153-155. It is also self-checking: a candidate that does not reproduce merkle_root means we could not place these leaves, so the producer leaves inclusion_path NULL rather than emitting a defect -- recompute-then-populate-or-decline never accuses a