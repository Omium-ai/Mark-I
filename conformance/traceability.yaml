  CON-004: [go:TestRunOneEmitsTypedEvidenceOnly, go:TestEvidenceRecordSchemaClosed, go:TestWireNoPathsNoExcerpts, go:TestWirePipelineNoPathsNoExcerpts, go:TestWireAuditCatchesAPlantedLeak, go:TestWireAuditDetectorRules, "partial:all four planes are now walked, but only 7 of the Event body oneof's 23 arms are ever driven into the audit. ModelRequest, ModelResponse, CoverageTransition, GuardDecision, ReceiptCheckpoint, EdgeHealth, the four vote arms, VerdictEvent, the two injection arms, ArtifactOutcome, RouteDecision and EvidenceExcerpt reach the wire audited by nothing -- a driving problem, not a detector problem. Two structural ceilings sit behind it: the hook shim is Rust and no hook-to-Event mapper exists anywhere in Go, so PostToolUse.json's transcript_path, cwd and tool_input.command -- the richest path payload in the corpus -- is unauditable from this module; and capture does NOT filter paths, which the planted-leak control proves by admitting, redacting, spooling and POSTing a path-bearing event unchallenged. This row's guarantee therefore lives in the typed protos and in producer discipline, with the audit as a regression net rather than an enforcement point. Verified by the lead rather than taken on report: planting a real filesystem path into Batch.sdk.agent_version reds the new audit and NOTHING else in the uplink package, including uplink_test.go's own SDK assertion, which pins name/version/agent and never reads agent_version"]  # P0, Phase 1, negative. The has-no-such-field clause is no longer asserted by a proto comment: TestEvidenceRecordSchemaClosed resolves m1p.v1.EvidenceRecord through protoreflect off the GENERATED descriptor and pins all six fields by name, number and kind, then closure, then zero oneofs and zero extension ranges -- so adding `message = 7` is red at the descriptor, not at review. The closure failure names the E0/E1 tiering and says the remedy is a CON-004 requirement change rather than a proto edit, because the whole point of the