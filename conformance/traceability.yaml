idening an already-reviewed sink is the biggest remaining hole -- prospective, since no such widening exists today. An unrecognised sink shape would also be invisible (io::copy, serde_json::to_writer, a BufWriter handed off elsewhere, a Command stdout redirect, mmap), and none of those exists in either caller crate today. Within-body textual order counts as domination only because these bodies are loop-free with early returns. And the older ceilings still stand: the walk reads pre-expansion source so a macro-generated switch is invisible; a re-exported env helper from another crate would read as an ordinary path token; and the allowlist can be widened in the same commit, so this forces the change into review rather than preventing it"]  # P0, Phase 1, negative
