  NFR-PORTABILITY-001: [gate:tools/ci/ci_matrix_gate.sh, gate:.github/workflows/ci.yml]  # P0, Phase 1, conformance. The gate parses ci.yml and asserts: it triggers on pull_request; every job running an edge recipe (build/lint/test go+rust) carries all three OSes with fail-fast off; every required-check name is a check the workflow really reports; and every job is required or reached through a required job's `needs`. It found the live defect -- `rust` and `go` were listed as required checks while both are matrix jobs reporting only `rust (ubuntu-24.04)` and friends, so neither name had ever been satisfiable. `platform-gate` now aggregates the six legs under one stable name. Whether GitHub's branch protection actually requires that name is a settings-page fact no in-repo artifact can read; it is a row comment rather than a `partial:` because a clause that can never be closed in-repo is how a row goes permanently red (D-CO).
  NFR-PORTABILITY-002: [go:TestHandshakeFirstFrameMustBeHello, go:TestHelloAckCarriesMaxFrame, go:TestHelloWithoutASessionIsRejected, go:TestFabricFrameUnwrapRoundTrip, go:TestDuplicatedOneofArmIsMalformed, rust:conf_vectors_m1pl_rust, rust:prop_accept_any_payload_any_split, rust:frame_roundtrip_every_fabric_arm, go:TestListenRefusesOverlongPath, go:TestListenSunPathBoundaryIsExact, go:TestRefusedOpenLeaksNoDescriptor, "partial:Windows perms are unimplemented not merely untested -- listener_windows.go:31-33 returns ErrNoWindowsFabric from both SocketPath and Listen and no test references that error; the real perm tests are //go:build unix and never compile on the Windows leg. macOS was RED for fourteen days and nothing local could see it: Darwin sun_path is 104 bytes and t.TempDir() there lives under /var/folders/<xx>/<long>/T/, so every socket path built from it overflowed and bind returned EINVAL -- 16 tests across fabric, cmd and adapters/claudecode failed from that one cause (CI run 33510590465). Now: fabric.Listen refuses first with ErrSocketPathTooLong naming byte count, platform, limit (len(syscall.RawSockaddrUnix{}.Path)-1: 107 linux, 103 darwin) and remedy, before MkdirAll so a refused path leaves nothing behind; tests bind under fabrictest.SocketDir (/tmp on darwin, t.TempDir() elsewhere) which fails loudly if <dir>/run/m1p.sock exceeds 103. The boundary is pinned EXACTLY: the builders overlong test overflowed by 120 bytes and a lead mutation dropping the -1 survived it, so TestListenSunPathBoundaryIsExact asserts sunPathMax bytes clears the guard and binds while sunPathMax+1 is refused -- the same mutation now reds with 108 bytes cleared the guard but bind refused it. Darwin is compile-checked (GOOS=darwin go vet) and NOT executed here; the macOS CI leg is the platform proof, on the next push. The Windows leg is a separate builder in flight", "partial:Windows, 17 tests across six packages, five root causes (CI run 33510590465), all fixed on Linux and compile-checked for Windows -- the Windows verdict is the go (windows-2022) leg on the next push. (1) capture was DEAD there: tailers/fileid_windows.go unconditionally returned no identity and newTailer refuses to construct without one, so every stream logged open failed and four tests saw zero events; now GetFileInformationByHandle (volume serial plus file index) with rotation via os.SameFile on both platforms. (2) the munge, see CON-012. (3) spool.Open leaked the ledger fd on a REFUSED boot on every platform (recover opens it before Open can fail; only lock was closed) -- proven with a /proc/self/fd probe on Linux, one descriptor per refused Open; Windows additionally pinned the file against RemoveAll. (4) the Windows single-writer lock byte at offset 0 overlapped the pid text lockDir writes at offset 0, and Windows byte-range locks are mandatory per-handle, so the loser could never read the holder pid; the lock byte is now at 1<<20. (5) the fakeClaude fixture was a sh script; now claude.cmd on windows, the same PATHEXT route Detect takes for npm. Skipped on windows with the requirement named: POSIX mode asserts (NFR-SECURITY-007 -- owner-only on Windows is an ACL nothing sets), the read-only-dir and chmod-0 fixtures (unconstructible there; production paths are platform-neutral). Named, not fixed: Go os.Open lacks FILE_SHARE_DELETE, so a held transcript cannot be renamed or deleted on Windows -- rotation is unreachable AND the vendors retention sweep cannot delete a transcript mark1d is tailing; needs a CreateFile open with share-delete. openSegmentLocked no longer leaks its new f when the header write or fsync fails (spool.go:641-651, one error path that closes first; no injection seam exists for a write failure on a fresh fd, so this one has no test). TestRefusedOpenLeaksNoDescriptor is the permanent form of the /proc/self/fd probe, with two subtests because the lock-refusal path never reaches recover -- only the recovery-refusal subtest reds when Open goes back to closing just the lock, which is why both are there"]  # P0, Phase 1, conformance
