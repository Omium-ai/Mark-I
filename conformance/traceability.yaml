  FR-SPINE-005: [rust:missing_or_wrong_bearer_is_401_m1e1002, rust:wrong_host_is_403_m1e4004, rust:any_origin_is_403_m1e4005, rust:loose_store_or_discovery_modes_are_refused, go:TestLoopbackRequiresSessionBearer, go:TestLoopbackRejectsNonLiteralHost, go:TestLoopbackRejectsForeignOrigin, go:TestLoopbackBindsLoopbackOnly, "partial:the mark1d loopback door now exists -- go/mark1d/internal/fabric/loopback.go serves POST /m1pl over its own 127.0.0.1:0 listener and applies the three 08 4.5 walls in declared order before the route match and before any body byte is read. The four rust: entries above prove cortexds MCP listener, a different door, and are retained as the Rust half of the same contract. Each Go wall is pinned by a lead-verified mutation: deleting the Host check turns all 9 subtests red (rebind names, bare literal, wrong port, [::1], octal and dotted-decimal spellings); downgrading the Origin check from map presence to a Header.Get non-empty test reds the present-but-empty subtest, which is exactly what a sandboxed or file:// page sends; binding 0.0.0.0 instead of 127.0.0.1 reds TestLoopbackBindsLoopbackOnly with bound ::. CORRECTION: an earlier wording said Server.Serve already accepting any net.Listener makes this row listener-sized. True of the TYPE, false of the BUILD -- handing Serve a TCP listener yields M1PL-over-TCP, a binary framed stream carrying no Host, Origin or Authorization header anywhere, which is precisely the unauthenticated localhost fallback 02:77 forbids; 08 4.5 specifies HTTP. Still owed: the 0600 loopback.json discovery file this rows own text names, per-session token issuance (one per-boot token today), POST /m1pl/gate (blocked on that issuance -- Gate.Answer needs an authenticated session id and the all-zero sentinel is what D-AT/D-AL refuse), the 429 M1E-9001 cap, GuardDecision emission for the 4004/4005 security-event column, and the cmd/main.go wiring, so nothing constructs the listener yet"]  # P0, Phase 1, negative
  FR-SPINE-006: [go:TestSpoolRoundTripAndOnDiskBytes, go:TestCorruptRecordIsDetectedAndAccounted, go:TestCloseDrainsPendingAppends, go:TestDiskHardStopBoundaryIsNinetyFivePercent, go:TestDiskHardStop, go:TestCrashRecoveryTruncationSweep, go:TestDefaultSegmentAndCapSizes, go:FuzzSpoolRecordDecode, go:TestEndToEndRecoveryScan]  # P0, Phase 1, unit + fuzz. The struck partial was stale twice over: the hard stop had been implemented (platform_unix.go diskUsedRatio, deliberately on st.Bavail so root-reserved blocks are not ours to spend) and TestDiskHardStop already drove it. What was genuinely unproven was narrower and worse. "Corrupt crc32c detected" had NO test reaching the CRC branch at all -- the truncation sweep's ~500 cuts trip the length checks first and the fuzz target returns on rejection, so disabling the crc compare left the whole package green. "Drain on shutdown" was masked by recovery: scanForward finds the records whether or not Close synced, so the drain could be deleted invisibly. And the boundary itself was only ever sampled at 99%, so the 95% in the requirement was a number no test knew. Each is now pinned at the level the mutation can be seen -- the corrupt record is a diagnostic among billing neighbours so its accounted class must come from byte [16] rather than from a guess, and the drain is asserted on the published ledger slot rather than on what a subsequent read happens to recover.
  FR-SPINE-007: [go:TestFullSpoolPolicyPerClass, go:TestIngestRequestShape, go:Test202QuarantinedEventsRideNextBatchAsDropped, go:TestEdgeLossLedgersBothReachTheWire]  # P0, Phase 1, chaos. <prose: the two halves are joined. The daemon owns TWO independent loss ledgers and the wiring line is what merges them: spool shed and admission refusal are different subsystems with different reasons, and a Drops slice that carried only one would still satisfy every pre-existing test because TestIngestRequestShape rides a stubDrops, not a spool. The new test drives a real assembled daemon, provokes both ledgers, and asserts both reason codes arrive in the SAME uploaded batch. Mutation-proved by dropping each element of the Drops slice in turn: either deletion reds only this test and leaves the rest of cmd/ green, which is exactly the blindness the partial named. Note the partial's cite had drifted -- the Drops: []uplink.DropSource{sp, adm} line is main.go:555, not :473, which is now SetContaminationHandler>
  FR-SPINE-008: [go:TestIngestRequestShape, go:TestReplayedBatchAcks200WithoutDuplicateSideEffects, go:TestBatchIDReuseWithDifferentBytesIs409, go:TestIntegrationProjectAndReplayDedupe, go:TestNoModuleDependsOnGRPC, go:TestNoFirstPartyGoSourceImportsGRPC, go:TestNoProtoDeclaresAService, go:TestNoRustCrateIsAGRPCStack, go:TestGRPCScannerAcceptsWhatMark1ActuallyShips]  # P0, Phase 1, conformance. <prose: the never-gRPC clause is now asserted at four independent layers, because any one of them alone is evadable: the Go module graph (a transitive grpc dependency cannot enter go.sum unnoticed), first-party Go imports (a vendored or replace-directive grpc would pass the module check), .proto service declarations (a service block is how a gRPC surface actually gets born, and buf would happily generate it), and the Rust crate manifests (tonic/tonic-build/hyper-as-a-grpc-stack). The fifth test is the positive control and is the one that matters most: an absence assertion is ALSO what a scanner that reads nothing reports, so it feeds the scanner the shapes Mark 1 genuinely ships -- connectrpc-free HTTP handlers, the committed prost output, buf.gen.yaml -- and fails if any is misread as gRPC. The partial's premise was incomplete rather than wrong: .golangci.yml:37-40 does carry an enforced depguard no-grpc rule and deny.toml:41 bans tonic. Neither is a test, neither reads a module graph, and neither scans a .proto -- and depguard's deny list names exactly one package, so connectrpc.com/connect walks past it. See D-DU>
  FR-SPINE-009: [go:TestBackoffOn5xxThenSuccess, go:TestRetryAfterIsAFloor, go:TestBackoffLadderIsCappedAtThirtyMinutes, go:TestBackoffDrawsFullJitterOverTheCappedExponential, go:TestTornConnectionIsRetriedNeverQuarantined, go:TestUnreachableEndpointExhaustsBudgetThenParks, go:TestParkAfterBudgetThenRequeueSucceeds, go:TestRunRequeuesParkedWorkOnNetworkChange, go:TestQuarantineOn4xxNeverRetried, go:TestMiddlebox200WithoutBatchIDEchoIsRetriedNotAcked, go:TestRedirectIsRefusedAndRetriedNeverAcked]  # P0, Phase 1, chaos. Both clauses the partial named are now closed, and closing the first one surfaced a finding carried in docs/RECONCILIATION.md rather than here: the min(exp, 30m) clamp is UNREACHABLE through the wire path, because maxAttempts=10 parks without sleeping, so the longest delay the uploader can ever request is attempt 9 = 25m36s and the unclamped ladder first crosses 30m at attempt 10. The clamp is therefore asserted white-box at u.backoff(n) over n=1..12 -- three rungs past the cap, 30m against an unclamped 51m12s/1h42m/3h25m -- while the ladder itself is asserted through the wire at Rand=1.0 (the jitter ceiling, the only draw at which a clamp is visible) against durations captured from the After seam, not sleep counts. The jitter test is separately load-bearing: dropping the rand multiplier leaves the ladder test green. Transport failure is now injected twice at different layers, because they fail differently -- panic(http.ErrAbortHandler) kills the connection after the request is accepted and with no status line, while a POST to a closed loopback port never speaks HTTP at all; both must retry and neither may quarantine, since quarantine is the 4xx verdict and a torn socket is not a verdict.
  FR-SPINE-010: [go:TestS3FailureMeansNoAckNoSideEffects, go:TestCleanBatchLandsAcksProjects, go:TestReplayReprojectsIdempotently, go:TestIngestKeyLayout, go:TestIntegrationLandNeverOverwritesALandedBatch, go:TestIntegrationDeviceStampRoundTrips, go:TestListCrossesAPageBoundary, go:TestListSinglePageReturnsEveryKey, "partial:clause 2 (acked batch reconstructable from S3 alone) now crosses a page boundary, so the silent-truncation hole is closed. List (s3land.go:289-305, loop at :295-303) pages via NewListObjectsV2Paginator, whose HasMorePages is firstPage or a non-empty token; a break after the first iteration truncates silently and reconstructs a SHORT batch set with every other assertion in this row still green. Lead-verified rather than taken on report: planting that break reds only TestListCrossesAPageBoundary, at got 3 objects want 5, while the single-page positive control stays green -- the discrimination that proves the refusal is the paginator and not a broken fake. The test drives the real deserializer and real paginator through a swapped s3.Options.HTTPClient and asserts page 2 arrived on a SECOND request carrying the token page 1 handed out, so a paginator that looped forever would fail rather than hang. What is still unproven is the SERVER half: no test exceeds S3's own 1000-key truncation point, so this covers the client loop and not the service behaviour that triggers it. CORRECTION: the partial struck here named the SSE-KMS write branch as this row's unproven clause, which mis-scoped it onto the wrong requirement -- 02:415 types this row S3-first ack and says nothing about encryption, while 02:665 maps S3/KMS to NFR-SECURITY-003, which is where TestLandEncryptsUnderPerTenantKMSKey and TestLandDisableSSEKMSOmitsEncryptionHeaders now sit. Paying that clause off here would have reported green for a property this row never claimed. The struck text was also wrong on the remedy: it prescribed a one-interface extraction, and what landed instead swaps s3.Opti