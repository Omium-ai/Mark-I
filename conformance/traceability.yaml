  FR-SPINE-002: [py:test_verdict_enum_diff_is_empty_across_proto_pg_and_python, go:TestClassAndReasonNumbersMirrorProto, rust:conf_vectors_m1pl_rust, gate:tools/ci/buf_breaking_gate.sh, "partial:clauses 1-2 are now proven and clause 3 is not. The gate deletes a field on a scratch copy of proto/ and requires buf to name FIELD_NO_DELETE_UNLESS_NUMBER_RESERVED specifically -- a bare non-zero exit is refused as a detection -- with two positive controls (an additive field and the reserved-both remedy) so a buf that errors on everything cannot satisfy it, and a contrast run of the identical candidate under use:[WIRE] proving the configured level is above WIRE rather than merely asserting it. It fingerprints proto/{m1p,buf.yaml,buf.lock} before and after and fails on any drift, so 'this gate does not write to the frozen tree' is checked per run. Clause 3 (a breaking change must become package m1p.v2, never an in-place edit) is enforced NEGATIVELY and that is the whole of it: justfile:245-246 runs buf breaking against '.git#branch=main,subdir=proto' at WIRE_JSON on every PR, so the in-place edit simply cannot land -- the only routes past a red lint-proto are reserve-on-delete or a new package. What no gate covers is the narrow residue where someone does create m1p/v2/ and gets its contents wrong, which is a review matter and not mechanisable here. Recorded rather than built: the enforcement already existed one rung up, and a second gate re-asserting it would be the duplicate-control smell, not coverage. Note the prior wording of this clause cited justfile:227-229 and ci.yml:54; both were stale (lint-proto is at justfile:244-246, and ci.yml:54 is inside a comment block), which is the D-DU drift pattern again"]  # P0, Phase 1, conformance
  FR-SPINE-003: [go:TestReplayStreams, go:TestReplayOvercount, go:TestReplayManager, go:TestDeriveUsageIdemKeyPerTenant, go:TestUsageIdemKeyIsolatesTenants, go:TestDeriveUsageIdemKeyGoldenVector, py:test_e2e_usage_deduped_per_idem_key_no_overcount, py:test_e2e_transcript_usage_matches_expectations]  # P0, Phase 1, conformance. The third clause ("HMAC keyed per tenant") is the one the replay suite structurally could not reach: those tests inject a testIdemKey stand-in, so they are key-AGNOSTIC by construction and stay green under a derivation that ignores the tenant root entirely. The clause is a privacy promise before it is a dedupe one -- 07 §7 upserts Usage on idem_key ALONE, so two tenants deriving one key for the same (session, message.id, request_id) triple fuses two organisations' ledgers. It is now proven at two levels because each catches what the other cannot: TestDeriveUsageIdemKeyPerTenant drives DeriveUsageIdemKey directly, while TestUsageIdemKeyIsolatesTenants replays the committed corpus through stream.consume/flush under two roots, which is the only one of the two that sees a break in IdemKey's HMAC construction downstream of a correct derivation. TestDeriveUsageIdemKeyGoldenVector freezes the HKDF label: a label change keeps keys 32 bytes, per-tenant and deterministic, so every behavioural test in the package survives it while every already-uploaded idem_key stops matching -- a wire break invisible to everything else.. <prose: 2026-09-15: the per-tenant HMAC idem_key and the 2.5x streaming-overcount defence are now proven on the WIRE, not in-process -- the e2e harness recomputes every key from the tenant root and finds one Usage event and one ledger row per key, output 1042 not 2562, no key with more than one event>
