{{- range $name, $sa := .Values.serviceAccounts }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $name }}
  namespace: {{ include "mark1.ns" $ }}
  annotations:
    argocd.argoproj.io/sync-wave: "0"
    {{- with $sa.roleArn }}
    eks.amazonaws.com/role-arn: {{ . }}
    {{- end }}
{{- end }}
