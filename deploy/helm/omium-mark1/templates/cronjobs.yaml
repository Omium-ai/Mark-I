{{- $jobs := list
  (dict "name" "mark1-intel-hourly" "svc" "intel" "app" "mark1-intel-jobs" "image" "mark1-intel" "sa" "intel" "schedule" .Values.cronJobs.intelHourly "cadence" "--hourly" "env" "mark1.intelEnv" "tmp" .Values.intel.tmpSizeLimit)
  (dict "name" "mark1-intel-nightly" "svc" "intel" "app" "mark1-intel-jobs" "image" "mark1-intel" "sa" "intel" "schedule" .Values.cronJobs.intelNightly "cadence" "--nightly" "env" "mark1.intelEnv" "tmp" .Values.intel.tmpSizeLimit "anthropic" true)
  (dict "name" "adjudicator-nightly" "svc" "adjudicator" "app" "adjudicator-jobs" "image" "mark1-adjudicator" "sa" "adjudicator" "schedule" .Values.cronJobs.adjudicatorNightly "cadence" "--nightly" "env" "mark1.adjEnv" "tmp" "256Mi")
}}
{{- range $j := $jobs }}
{{- $svc := index $.Values $j.svc }}
{{- if $svc.enabled }}
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ $j.name }}
  namespace: {{ include "mark1.ns" $ }}
  annotations:
    argocd.argoproj.io/sync-wave: "2"
  labels:
    app: {{ $j.app }}
spec:
  schedule: {{ $j.schedule | quote }}
  timeZone: Etc/UTC
  suspend: false
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 600
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      activeDeadlineSeconds: {{ $.Values.cronJobs.activeDeadlineSeconds }}
      ttlSecondsAfterFinished: 259200
      template:
        metadata:
          labels:
            app: {{ $j.app }}
        spec:
          restartPolicy: Never
          serviceAccountName: {{ $j.sa }}
          {{- include "omium.podSecurityContext" (dict "root" $ "svc" $j.svc) | nindent 10 }}
          {{- with $.Values.global.imagePullSecrets }}
          imagePullSecrets:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          containers:
          - name: jobs
            {{- include "omium.containerSecurityContext" (dict "root" $ "svc" $j.svc) | nindent 12 }}
            image: {{ include "mark1.image" (dict "root" $ "name" $j.image "tag" $svc.imageTag "key" (printf "%s.imageTag" $j.svc)) }}
            # every active tenant from m1_tenant_directory (m1_084): a tester's tenant born after the static list gets its rollups too; the list stays for the witness
            command: ["python", "-m", "app.jobs", "run", "--all", {{ $j.cadence | quote }}, "--tenant", "all"]
            env:
            {{- include $j.env $ | nindent 12 }}
            {{- if $j.anthropic }}
            - name: ANTHROPIC_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ $.Values.secrets.anthropic }}
                  key: api_key
                  optional: true
            {{- end }}
            resources:
              {{- toYaml $svc.resources | nindent 14 }}
            volumeMounts:
            - name: tmp
              mountPath: /tmp
          volumes:
          - name: tmp
            emptyDir:
              sizeLimit: {{ $j.tmp }}
{{- end }}
{{- end }}
