// m1p.v1 — local-fabric control messages (D-N).
//
// Transcribed from 08 §4.2's control table and §4.3's handshake, which have
// declared these shapes since the doc set froze while citing them as "defined
// in m1p.v1, doc 07" — a definition no .proto carried. Two build waves hit
// that hole independently (the shim's gate.rs and mark1d's Hello handshake
// both reported it unimplementable), so the definition now exists where the
// citation always said it did. The fields below are 08's, transcribed —
// nothing here is authored from memory.
//
// SCOPE, NORMATIVE (08 §4.2): control messages ride M1PL frames on the local
// fabric ONLY. They never reach the spool, never reach the wire, and are not
// members of Event.body — which is why nothing in this file carries an
// event_id, a durability class, or a server-stamped band. A control message
// appearing anywhere durable is a bug by definition.
//
// Everything here is [P0] operational: component names, pids, counts, enum
// codes. No user content, nothing derived from it.

syntax = "proto3";

package m1p.v1;

import "m1p/v1/artifacts.proto";
import "m1p/v1/envelope.proto";
import "m1p/v1/intelligence.proto";

// DECISION D-U (lead, binding). The payload of EVERY M1PL frame is one
// serialized FabricFrame. 07 §5 and 08 §4.2 always said the payload is "an
// Event, or a control message" — but proto3 bytes are not self-describing, so
// without a carried discriminator both ends of the fabric would have to guess
// (or worse, invent independent conventions — the exact hole that produced
// D-N). This oneof IS that sentence made executable. The M1PL header
// (magic|ver|len) is untouched; the fabric is an "internal" tier surface
// (08 §1), both ends ship in one signed package, and nothing is deployed —
// this change is the cheapest it will ever be.
//
// Event keeps field 1: it is the overwhelming majority of frames and field 1
// costs the smallest tag. mark1d unwraps and spools the INNER Event bytes —
// the spool record layout (07 §6) does not change, and control messages
// remain structurally unspoolable: there is no oneof arm a spool record can
// carry, because admission takes the Event, not the frame.
// TAG ALLOCATION, recorded here so a later wave cannot collide by picking the
// next free number (D-AI): 8 = ContextQuery, 9 = ContextReply (D-AE, the
// memory/cortex pull — fields below), 10 = ContaminationAlert (defined below).
message FabricFrame {
  oneof kind {
    Event event = 1;
    Hello hello = 2;
    HelloAck hello_ack = 3;
    GateQuery gate_query = 4;
    GateVerdict gate_verdict = 5;
    Flush flush = 6;
    FlushAck flush_ack = 7;
    ContextQuery context_query = 8;
    ContextReply context_reply = 9;
    ContaminationAlert contamination_alert = 10;
  }
}

// The shim's pull for injected context (D-AE): the session rides the Hello
// that bound this connection, exactly as GateQuery. The daemon answers from
// its synced memory cache and the cortex map; every failure is an empty reply
// (fail-open for availability, 08 §5 rule 5). Byte contract pinned by
// go/mark1d/internal/fabric/context_test.go and rust/mark1-hookshim/src/context.rs.
message ContextQuery {
  InjectionChannel channel = 1;
  string tool_name = 2;
  // The vendor's error text on PostToolUseFailure, normalized on the daemon
  // side into the pitfall signature (06 §9.5); never stored, never uploaded.
  string error = 3;
  uint32 deadline_ms = 4;
  bool is_interrupt = 5;
}

message ContextReply {
  // Rendered additionalContext, empty when nothing injects; the shim prints
  // nothing on empty. The daemon has already admitted the MemoryInjection.
  string additional_context = 1;
}

// First frame on every connection (08 §4.3 step 2: any other first frame ⇒
// close M1E-4003). mark1d replies HelloAck or closes.
message Hello {
  // "mark1-hookshim" | "mark1-proxy" | "cortexd" | "tailer" — the writer set
  // 07 §5 enumerates. Free text, not an enum: a new writer must be able to
  // introduce itself before the daemon's release knows its name.
  string component = 1;
  uint32 pid = 2;
  // The writer's own semver, for `mark1 doctor` correlation — never an
  // admission criterion (rejection authority belongs to the M1PL ver byte).
  string version = 3;
  // 16-byte session UUIDv7. REQUIRED, non-zero, from every writer (D-AT): this
  // is the attribution key for everything the connection goes on to send, so a
  // writer without one is a writer whose events attribute to nothing. Missing,
  // wrong-length or all-zero ⇒ the daemon closes with M1E-4003.
  //
  // This field previously read "empty for session-less writers (cortexd push
  // maps)". That sanctioned a writer the daemon accepted and then silently
  // dropped everything from, which is the failure D-AT exists to end. cortexd
  // is not exempt — it has no session identity yet, so its pushes are refused
  // and counted until the MCP surface carries one (D-AV).
  //
  // ONE exemption, ADR-0012: a writer whose component starts with "ext:" (a
  // third-party host that owns its own execution loop and cannot know a Mark 1
  // session id) MAY leave this empty. The daemon then MINTS the session and
  // returns it in HelloAck.session_id; every Event on that connection must
  // echo it or the daemon closes (M1E-4003). An "ext:" writer that does carry
  // a 16-byte id is bound to that id exactly like any other writer.
  bytes session_id = 4;
  // The writer's working directory — the agent's project root for a hook
  // process. LOCAL FABRIC ONLY: it never enters an event or the uplink; the
  // daemon maps it to an enabled workspace and stamps SessionStart.workspace_id
  // (the HMAC) from it. Empty when the writer has no meaningful cwd.
  string cwd = 5;
  // ADR-0012: the host's OWN reference for this session (its run id, thread
  // id, whatever it correlates by). Opaque, ≤ 256 bytes, [P1]: stored beside
  // the Mark 1 session for later receipt echo, NEVER used as the Mark 1
  // session id and never an admission criterion. Empty for first-party
  // writers, which have no second identity to correlate.
  string host_correlation_id = 6;
}

message HelloAck {
  bool accepted = 1;
  // The daemon stating M1PL_MAX_FRAME (07 §5's symbol — the daemon telling
  // the writer which build it is talking to, NOT a negotiated ceiling: a
  // writer may send smaller frames, never a larger bound).
  uint32 max_frame = 2;
  // Set only when accepted = false: the single M1PL version this daemon
  // speaks. Possible only mid-upgrade, and loud (08 §4.3 step 3).
  uint32 want_ver = 3;
  // ADR-0012: the 16-byte session UUIDv7 the daemon MINTED for an "ext:"
  // writer whose Hello carried no session_id. Set ONLY in that case; every
  // other accepted Hello gets an empty field, because the writer already
  // knows its session. The writer echoes it in Event.session_id on every
  // frame of this connection.
  bytes session_id = 4;
}

// hookshim → mark1d: read the cached VerdictEvent{PROVISIONAL} + knee state
// for a gate decision. THE GATE READS THE CACHE; IT NEVER COMPUTES — this
// round-trip is a map lookup, budgeted ≤ 5 ms (08 §4.2).
message GateQuery {
  // task_seg task id, same bytes as Event.task_id (envelope.proto field 4).
  bytes task_id = 1;
  GateKind gate = 2;
  // The shim, not the daemon, owns the agent-facing deadline: the agent
  // hook's own budget minus 10 ms (08 §4.4). The daemon treats an expired
  // deadline as "answer allow, count Dropped{gate_timeout}" — fail-open for
  // availability, the posture matrix's first row.
  uint32 deadline_ms = 3;
}

enum GateKind {
  GATE_KIND_UNSPECIFIED = 0;
  GATE_KIND_STOP = 1;
  GATE_KIND_TOOL = 2;
}

message GateVerdict {
  GateDecision decision = 1;
  // The fused verdict backing the decision — the one Verdict enum
  // (artifacts.proto, BUILD-01: one vocabulary, everywhere).
  Verdict verdict = 2;
  // Ordered exactly [satisfied, violated, refused, error] (08 §2's rule for
  // every posterior[4] on every surface).
  repeated double posterior = 3;
  string reason = 4;
  // Reference into the local evidence store (~/.omium/mark1/evidence/…),
  // resolvable on THIS device only — never a URL, never uploaded content.
  string evidence_ref = 5;
  // At the knee (08 §5.1 Stop row): the shim exits 0 with no decision and
  // surfaces this as the hook's systemMessage — verdict plus evidence for the
  // human, never for the model (founder ruling 2026-09-16). Empty below the
  // knee and on ALLOW.
  string system_message = 6;
}

enum GateDecision {
  GATE_DECISION_UNSPECIFIED = 0;
  GATE_DECISION_ALLOW = 1;
  GATE_DECISION_BLOCK = 2;
}

// Mandatory drain barrier on SessionEnd/shutdown (08 §4.2): the writer sends
// Flush and MUST wait for FlushAck before exiting its drain path — the one
// place the fire-and-forget fabric is allowed to block, because 07 §6's
// "mandatory drain on SessionEnd" is a durability promise, not a latency one.
message Flush {}

message FlushAck {
  // Events the daemon admitted to the spool since this connection's Hello —
  // the writer's receipt that its stream is durable, not a global counter.
  uint64 drained = 1;
}

// proxy → mark1d, ONE-WAY (D-AI). 04 §3.1 step 6's config rollback: an upstream
// subscription-billing marker means an OAuth credential reached the wire — the
// CON-001 P0 — and the base-URL fragment must stop pointing at the proxy before
// the agent's next request.
//
// The proxy NEVER awaits a reply. It has already killed the session and will
// refuse every subsequent request for it on its own authority; this frame is
// notification, not permission, because a P0 kill that blocks on a daemon
// round-trip is a P0 kill a hung daemon can veto. If mark1d is unreachable the
// fragment stays pointed at a proxy that now refuses everything for the session,
// so the failure direction is closed.
//
// Deliberately carries no evidence. Control messages are non-durable by scope
// (this file's header): evidence fields here would be evidence that is thrown
// away. The provable record is the GuardDecision event + its per-event
// `guard_contamination` receipt (policy.proto, 07 §11), which takes the durable
// path. This frame carries only what mark1d needs to act.
message ContaminationAlert {
  // 16-byte session UUIDv7, same bytes as Hello.session_id — what to attribute
  // the resulting CoverageTransition{BYPASS} to.
  bytes session_id = 1;
  // The M1-Cred-Ref that transited. mark1d issued it at provisioning, so this
  // is what resolves to the agent + workspace whose fragment must be reverted;
  // session_id alone does not identify a config file.
  string cred_ref = 2;
  // GuardDecision.reason_code's closed edge-emitted vocabulary (policy.proto);
  // "oauth_marker" is its only current member here. Present so `mark1 doctor`
  // can state why a fragment reverted — a silent rollback is unexplainable.
  string reason_code = 3;
}
