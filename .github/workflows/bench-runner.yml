# Starts the pinned bench runner (docs/runbooks/bench-runner.md) — a stopped EC2 instance that registers itself
# as a self-hosted runner on boot and shuts itself down after 20 idle minutes.
#
# Called by ci.yml (main pushes) and release.yml before their `bench` jobs; the weekly schedule is a
# keepalive, because GitHub deletes a self-hosted runner that has been offline for 14 days.
# The OIDC subject is the CALLER's ref, so this only works from main and edge/v* tags — the
# release role trusts nothing else, which is also why PR benches stay deferred.
name: bench-runner

on:
  workflow_call:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * 1"

permissions:
  id-token: write
  contents: read

jobs:
  wake:
    name: bench-runner wake
    if: vars.MARK1_BENCH_RUNNER != '' && vars.MARK1_BENCH_INSTANCE_ID != ''
    runs-on: ubuntu-24.04
    steps:
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_RELEASE_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      - name: Start one of the pinned instances (first that has capacity wins)
        env:
          IDS: ${{ vars.MARK1_BENCH_INSTANCE_ID }}
        run: |
          set -euo pipefail
          # A stopped instance is bound to its AZ and EC2 can answer InsufficientInstanceCapacity for a
          # while; try each box a few times, in order, before giving up.
          for id in $IDS; do
            for attempt in 1 2 3 4; do
              if aws ec2 start-instances --instance-ids "$id" >/dev/null 2>&1; then
                aws ec2 wait instance-running --instance-ids "$id"
                echo "bench runner $id is running; the runner service registers within a minute and the bench job queues on label ${{ vars.MARK1_BENCH_RUNNER }}"
                exit 0
              fi
              echo "start of $id refused (attempt $attempt/4, likely capacity); retrying in 30s"
              sleep 30
            done
            echo "::warning title=Bench box unavailable::$id would not start after 4 attempts; trying the next one"
          done
          echo "::error title=No bench runner would start::none of [$IDS] could be started (EC2 capacity). The budgets were not measured."
          exit 1
