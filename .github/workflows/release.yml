# omium-mark1 release — tag-triggered edge release (13 §9.3.2).
#
#   tag edge/vX.Y.Z  ->  green ci run on that SHA + MANDATORY benchmarks  ->  five-triple build
#                    ->  sign/notarize per OS (13 §8.4, 09 §11.1)
#                    ->  CycloneDX SBOM + SLSA provenance per artifact (13 §8.5)
#                    ->  publish + open the ring-0 manifest PR (09 §11.2)
#
# Cloud services have no semver: they are promoted by <sha7> through GitOps (13 §9.1/§9.3.1).
# The `images` job here exists for the release-lane container scan and attestation only.
name: release

on:
  push:
    tags:
      - "edge/v*"

permissions:
  contents: write        # create the release, open the manifest PR branch
  id-token: write        # OIDC: Azure Trusted Signing, AWS ECR, provenance
  attestations: write    # SLSA build provenance
  packages: read

env:
  CARGO_TERM_COLOR: always
  GO_VERSION: "1.25.14"
  BUF_VERSION: "1.72.0"          # justfile M1_BUF_VERSION and ci.yml carry the same pin
  SYFT_VERSION: "v1.20.0"
  NFPM_VERSION: "v2.41.1"

jobs:
  # ---------------------------------------------------------------------------
  # The gate set runs on the TAGGED COMMIT, from a clean checkout — in ci.yml, on the main push
  # that produced it, as 16 parallel jobs. Re-running the same recipes here serially in one job
  # took 50 minutes and proved nothing ci.yml had not (it only found the ways one job's
  # environment differed from sixteen). So `verify` is the proof that ci.yml ran on exactly this
  # SHA and went green; it waits for a run still in flight and refuses a commit that has none.
  # Nothing is inherited from a PR: the run must be the push to main of this very commit.
  # ---------------------------------------------------------------------------
  verify:
    name: verify
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: read
    outputs:
      # The commit whose ci run proved this tag — also the <sha7> ci.yml built and attested the cloud images under.
      sha: ${{ steps.ci.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: The tagged commit carries a green ci run
        id: ci
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # A commit that changes ONLY the release workflows is invisible to ci.yml (nothing there
          # runs them), so its parent's green run is the same proof; walk up to 5 such commits.
          release_only() { local d; d=$(git diff --name-only "$1^" "$1"); [ -n "$d" ] && ! grep -qvE '^\.github/workflows/(release|bench-runner)\.yml$' <<<"$d"; }
          sha=$GITHUB_SHA; hops=0; misses=0
          for attempt in $(seq 1 90); do
            q="repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?head_sha=$sha&event=push&per_page=1"
            run=$(gh api "$q" --jq '.workflow_runs[0] // empty | "\(.id) \(.status) \(.conclusion // "-") \(.html_url)"')
            dead=""
            if [ -n "$run" ]; then
              set -- $run
              case "$2:$3" in
                completed:success) echo "ci run $1 is green on $sha ($hops release-only commit(s) above it): $4"; echo "sha=$sha" >> "$GITHUB_OUTPUT"; exit 0 ;;
                # The concurrency queue cancels a pending main run when a newer push lands; that is
                # not a verdict on the code, so a release-only commit may still hop past it.
                completed:cancelled|completed:skipped) echo "ci run $1 on $sha was $3: $4"; dead=1 ;;
                completed:*) echo "::error title=ci is not green on this commit::run $1 on $sha concluded '$3': $4"; exit 1 ;;
              esac
            fi
            if [ "$hops" -lt 5 ] && release_only "$sha"; then
              echo "$sha changes only the release workflows; checking its parent instead"
              sha=$(git rev-parse "$sha^"); hops=$((hops+1)); continue
            fi
            [ -n "$dead" ] && { echo "::error title=ci never finished on this commit::re-run ci on $sha (gh run rerun) and push the tag again"; exit 1; }
            if [ -z "$run" ]; then
              misses=$((misses+1))
              [ "$misses" -ge 6 ] && { echo "::error title=No ci run for this commit::$sha was never pushed to main (ci.yml runs there). Tag a main commit."; exit 1; }
              echo "no ci run yet for $sha (attempt $attempt); waiting 10s"; sleep 10; continue
            fi
            echo "ci run $1 on $sha is $2 (attempt $attempt/90); waiting 40s"; sleep 40
          done
          echo "::error title=ci did not finish::gave up waiting for ci on $sha after an hour"; exit 1

  # ---------------------------------------------------------------------------
  # Benchmarks, MANDATORY and with no fallback.
  #
  # The PR lane may defer this stage when the pinned runner is unavailable (ci.yml
  # `bench-deferred`) — that is the whole point of deferring: it keeps an unowned machine off
  # the critical path of every merge while guaranteeing the budgets are still enforced exactly
  # once, here, before anything ships. If the runner is not available at release time the
  # release FAILS. A performance regression can merge; it cannot ship.
  # ---------------------------------------------------------------------------
  # `runs-on` is resolved by the scheduler BEFORE any step runs, so a refusal step inside `bench`
  # could never fire: with the variable empty the label set matches no runner and the job just
  # queues until GitHub's 24h timeout. The check has to be its own job on a hosted runner — the
  # same shape ci.yml uses for bench/bench-deferred.
  bench-preflight:
    name: bench-preflight
    if: vars.MARK1_BENCH_RUNNER == ''
    runs-on: ubuntu-24.04
    steps:
      - run: |
          echo "::error title=No pinned bench runner::12 §7.1's budgets gate this release and can only be measured on the pinned runner class (bench/RUNNER.md). Provision it and set MARK1_BENCH_RUNNER."
          exit 1

  # The pinned box is stopped between runs; bench-runner.yml starts it (release role, OIDC).
  bench-wake:
    name: bench-wake
    if: vars.MARK1_BENCH_RUNNER != ''
    uses: ./.github/workflows/bench-runner.yml
    permissions:
      id-token: write
      contents: read

  bench:
    name: bench
    needs: [bench-preflight, bench-wake]
    # A skipped `needs` skips its dependents unless the condition carries a status function, and
    # bench-preflight is skipped exactly when the runner IS configured — which is when bench must
    # run. Hence !cancelled() rather than a bare variable test.
    if: ${{ !cancelled() && vars.MARK1_BENCH_RUNNER != '' && needs.bench-wake.result == 'success' }}
    runs-on: [self-hosted, "${{ vars.MARK1_BENCH_RUNNER }}"]
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: extractions/setup-just@v2
      - run: just bench
      - name: Record the result against the trend (12 §7.2)
        run: |
          mkdir -p bench/history
          cp -r target/criterion "bench/history/${GITHUB_REF_NAME//\//-}" 2>/dev/null || true
      - uses: actions/upload-artifact@v4
        with:
          name: bench-results
          path: bench/history/

  # ---------------------------------------------------------------------------
  # Five triples (13 §2.3): x86_64/aarch64 linux-gnu, x86_64/aarch64 apple-darwin,
  # x86_64-pc-windows-msvc. glibc, not musl. Built with --locked / -mod=readonly from a clean
  # checkout, so "what ran during the build" is toolchain + lockfile and nothing else — the
  # honest precondition for the provenance statement below (13 §2.4).
  # ---------------------------------------------------------------------------
  build-edge:
    name: build-edge (${{ matrix.triple }})
    needs: [verify, bench]
    # bench-preflight is skipped whenever the runner is configured, and GitHub skips a plain-`needs`
    # job through ANY skipped ancestor — run 35249132843 went green having built nothing. Status
    # functions all the way down, as bench itself does.
    if: ${{ !cancelled() && needs.verify.result == 'success' && needs.bench.result == 'success' }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-24.04, triple: x86_64-unknown-linux-gnu,  goos: linux,   goarch: amd64 }
          - { os: ubuntu-24.04, triple: aarch64-unknown-linux-gnu, goos: linux,   goarch: arm64 }
          - { os: macos-14,     triple: x86_64-apple-darwin,       goos: darwin,  goarch: amd64 }
          - { os: macos-14,     triple: aarch64-apple-darwin,      goos: darwin,  goarch: arm64 }
          - { os: windows-2022, triple: x86_64-pc-windows-msvc,    goos: windows, goarch: amd64 }
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      # rust-toolchain.toml pins the channel (1.91), and cargo obeys it over whatever the action
      # installed — so the cross target has to be added to THAT toolchain, from inside the repo.
      - run: rustup target add ${{ matrix.triple }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: edge-${{ matrix.triple }}
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: go/*/go.sum
      - name: Cross linker for aarch64 linux
        if: matrix.triple == 'aarch64-unknown-linux-gnu'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu
          echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc" >> "$GITHUB_ENV"
          echo "CC_aarch64_unknown_linux_gnu=aarch64-linux-gnu-gcc" >> "$GITHUB_ENV"
      - name: Rust edge binaries
        run: cargo build --release --locked --target ${{ matrix.triple }} -p mark1-proxy -p mark1-hookshim -p cortexd
      - name: Go edge binaries
        shell: bash
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: |
          set -euo pipefail
          mkdir -p "dist/${{ matrix.triple }}"
          ext=""; [ "${{ matrix.goos }}" = windows ] && ext=.exe
          for m in mark1d mark1; do
            (cd "go/$m" && go build -mod=readonly -trimpath -ldflags "-s -w" \
               -o "../../dist/${{ matrix.triple }}/$m$ext" ./cmd)
          done
      - name: Stage the supervised set
        shell: bash
        run: |
          set -euo pipefail
          for b in mark1-proxy mark1-hookshim cortexd; do
            src="target/${{ matrix.triple }}/release/$b"
            [ -f "$src.exe" ] && src="$src.exe"
            cp "$src" "dist/${{ matrix.triple }}/"
          done
          ls -l "dist/${{ matrix.triple }}"
      - uses: actions/upload-artifact@v4
        with:
          name: edge-${{ matrix.triple }}
          path: dist/${{ matrix.triple }}/
      # The raw per-triple set is what the desktop app's release fetches and packages beside itself (Mark-1-GUI release.yml).
      - name: Raw per-triple tarball
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist/pkg
          tar -czf "dist/pkg/mark1-${GITHUB_REF_NAME#edge/v}-${{ matrix.triple }}.tar.gz" -C "dist/${{ matrix.triple }}" .
      - uses: actions/upload-artifact@v4
        with:
          name: pkg-raw-${{ matrix.triple }}
          path: dist/pkg/

  # ---------------------------------------------------------------------------
  # macOS: lipo to Universal2, hardened-runtime codesign, .pkg, notarize, staple.
  # Notarization is NOT optional — Gatekeeper quarantines unsigned daemons and mark1d is exactly
  # the long-lived background process users are trained to distrust (09 §11.1).
  # ---------------------------------------------------------------------------
  package-macos:
    name: package-macos
    needs: build-edge
    # Signed .pkg only once the Developer ID is set as a repo variable (mark1-signing-accounts.md §1) and deploy/packaging/macos exists; the raw tarball ships regardless.
    if: ${{ !cancelled() && needs.build-edge.result == 'success' && vars.APPLE_DEVELOPER_ID_APPLICATION != '' }}
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { name: edge-x86_64-apple-darwin,  path: dist/x86_64-apple-darwin }
      - uses: actions/download-artifact@v4
        with: { name: edge-aarch64-apple-darwin, path: dist/aarch64-apple-darwin }
      - name: lipo Universal2
        run: |
          set -euo pipefail
          mkdir -p dist/universal2
          for b in mark1d mark1 mark1-proxy mark1-hookshim cortexd; do
            chmod +x dist/*/"$b"
            lipo -create -output "dist/universal2/$b" \
              "dist/x86_64-apple-darwin/$b" "dist/aarch64-apple-darwin/$b"
            lipo -info "dist/universal2/$b"
          done
      - name: Import Developer ID certificate
        env:
          P12: ${{ secrets.APPLE_DEVELOPER_ID_P12 }}
          P12_PASSWORD: ${{ secrets.APPLE_DEVELOPER_ID_P12_PASSWORD }}
        run: |
          set -euo pipefail
          security create-keychain -p "$RUNNER_TEMP" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "$RUNNER_TEMP" build.keychain
          echo "$P12" | base64 --decode > "$RUNNER_TEMP/devid.p12"
          security import "$RUNNER_TEMP/devid.p12" -k build.keychain -P "$P12_PASSWORD" \
            -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$RUNNER_TEMP" build.keychain >/dev/null
          rm -f "$RUNNER_TEMP/devid.p12"
      - name: codesign + pkgbuild + notarize + staple
        env:
          DEVELOPER_ID: ${{ vars.APPLE_DEVELOPER_ID_APPLICATION }}
          NOTARY_KEY_ID: ${{ secrets.APPLE_NOTARY_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ secrets.APPLE_NOTARY_ISSUER_ID }}
          NOTARY_KEY_P8: ${{ secrets.APPLE_NOTARY_KEY_P8 }}
          VERSION: ${{ github.ref_name }}
        run: deploy/packaging/macos/notarize.sh dist/universal2
      - uses: actions/upload-artifact@v4
        with:
          name: pkg-macos
          path: dist/pkg/

  # ---------------------------------------------------------------------------
  # Windows: WiX MSI, Authenticode via Azure Trusted Signing over an OIDC-scoped CI identity —
  # chosen over an EV token so a one-founder company has no hardware-token custody (09 §11.1).
  # ---------------------------------------------------------------------------
  package-windows:
    name: package-windows
    needs: build-edge
    if: ${{ !cancelled() && needs.build-edge.result == 'success' && vars.AZURE_TRUSTED_SIGNING_ENDPOINT != '' }}
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { name: edge-x86_64-pc-windows-msvc, path: dist/win }
      - name: Build MSI (WiX)
        shell: pwsh
        run: |
          dotnet tool install --global wix --version 5.0.2
          wix build deploy/packaging/windows/mark1.wxs `
            -d BinDir="$PWD/dist/win" -d Version="$($env:GITHUB_REF_NAME -replace '^edge/v','')" `
            -o dist/pkg/mark1.msi
      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - uses: azure/trusted-signing-action@v0.5
        with:
          endpoint: ${{ vars.AZURE_TRUSTED_SIGNING_ENDPOINT }}
          trusted-signing-account-name: ${{ vars.AZURE_TRUSTED_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ vars.AZURE_TRUSTED_SIGNING_PROFILE }}
          files-folder: dist/pkg
          files-folder-filter: msi,exe
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256
      - uses: actions/upload-artifact@v4
        with:
          name: pkg-windows
          path: dist/pkg/

  # ---------------------------------------------------------------------------
  # Linux: nfpm .deb/.rpm + tarball, each binary carrying a detached signature that
  # `mark1 verify-release` checks before execution.
  # ---------------------------------------------------------------------------
  package-linux:
    name: package-linux
    needs: build-edge
    # deb/rpm + GPG once deploy/packaging/linux/nfpm.yaml and the GPG key exist (repo variable LINUX_PACKAGING=1); the raw tarball ships regardless.
    if: ${{ !cancelled() && needs.build-edge.result == 'success' && vars.LINUX_PACKAGING != '' }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { name: edge-x86_64-unknown-linux-gnu,  path: dist/x86_64-unknown-linux-gnu }
      - uses: actions/download-artifact@v4
        with: { name: edge-aarch64-unknown-linux-gnu, path: dist/aarch64-unknown-linux-gnu }
      - name: nfpm packages + tarballs
        run: |
          set -euo pipefail
          go install github.com/goreleaser/nfpm/v2/cmd/nfpm@${NFPM_VERSION}
          VERSION="${GITHUB_REF_NAME#edge/v}"
          mkdir -p dist/pkg
          for triple in x86_64-unknown-linux-gnu aarch64-unknown-linux-gnu; do
            chmod +x "dist/$triple"/*
            arch=amd64; [ "$triple" = "aarch64-unknown-linux-gnu" ] && arch=arm64
            for fmt in deb rpm; do
              NFPM_VERSION_ENV="$VERSION" BIN_DIR="dist/$triple" ARCH="$arch" \
                nfpm package -f deploy/packaging/linux/nfpm.yaml -p "$fmt" -t dist/pkg/
            done
          done
      - name: Detached GPG signatures
        env:
          GPG_PRIVATE_KEY: ${{ secrets.LINUX_RELEASE_GPG_KEY }}
          GPG_PASSPHRASE: ${{ secrets.LINUX_RELEASE_GPG_PASSPHRASE }}
        run: |
          set -euo pipefail
          echo "$GPG_PRIVATE_KEY" | gpg --batch --import
          for f in dist/pkg/*; do
            gpg --batch --yes --pinentry-mode loopback --passphrase "$GPG_PASSPHRASE" \
              --detach-sign --armor -o "$f.asc" "$f"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: pkg-linux
          path: dist/pkg/

  # ---------------------------------------------------------------------------
  # Cloud images. ci.yml's `cloud-images` job builds, scans, pushes and attests
  # omium/mark1-<svc>:<sha7> on every main push; the ECR repos are IMMUTABLE, so a release-time
  # rebuild of the same tag would be rejected (13 §9.5). This lane therefore verifies what exists:
  # the image for the tagged commit must be present, its build provenance must verify against this
  # repo, and it must still pass trivy at release time (12 §11.3). Any of the three red = no release.
  # ---------------------------------------------------------------------------
  images:
    name: images
    needs: verify
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        name: [controld, intel, adjudicator]
    steps:
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_RELEASE_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      - uses: aws-actions/amazon-ecr-login@v2
        id: ecr
      - id: ref
        run: |
          set -euo pipefail
          # The images live under the sha7 of the commit verify proved (ci.yml built them there).
          proven="${{ needs.verify.outputs.sha }}"
          ref="${{ steps.ecr.outputs.registry }}/omium/mark1-${{ matrix.name }}:${proven::7}"
          docker manifest inspect "$ref" > /dev/null || {
            echo "::error title=No cloud image for this commit::$ref is not in ECR. ci.yml's cloud-images job pushes it on every main push (with AWS_RELEASE_ROLE_ARN set); tag a main commit that was built."
            exit 1
          }
          echo "ref=$ref" >> "$GITHUB_OUTPUT"
      - name: Verify build provenance (the builder attested; this lane checks)
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh attestation verify "oci://${{ steps.ref.outputs.ref }}" --repo "$GITHUB_REPOSITORY"
      - uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ steps.ref.outputs.ref }}
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"

  # ---------------------------------------------------------------------------
  # SBOM + SLSA + publish. NFR-SECURITY-004: a release without an SBOM does not publish, and
  # `mark1 verify-release` checks signature AND provenance (repo, workflow, commit SHA) before
  # any binary is executed (09 §11.2).
  # ---------------------------------------------------------------------------
  publish:
    name: publish
    needs: [build-edge, package-macos, package-windows, package-linux, images]
    # The raw per-triple tarballs publish as soon as build-edge and the image checks pass; a skipped signed package is not a failure.
    if: ${{ !cancelled() && needs.build-edge.result == 'success' && needs.images.result == 'success' && !contains(needs.*.result, 'failure') }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: pkg-*
          path: dist/pkg
          merge-multiple: true
      - name: CycloneDX SBOM per artifact
        run: |
          set -euo pipefail
          curl -fsSL https://raw.githubusercontent.com/anchore/syft/main/install.sh \
            | sh -s -- -b /usr/local/bin "${SYFT_VERSION}"
          mkdir -p dist/sbom
          # Source SBOM for the whole release (the `just sbom` recipe's output).
          syft dir:. -o cyclonedx-json > dist/sbom/mark1-source.cdx.json
          for f in dist/pkg/*; do
            case "$f" in *.asc|*.cdx.json) continue ;; esac
            syft "file:$f" -o cyclonedx-json > "dist/sbom/$(basename "$f").cdx.json"
          done
          test -s dist/sbom/mark1-source.cdx.json   # no SBOM, no release
      - name: SLSA build provenance for every published artifact
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: "dist/pkg/*"
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#edge/v}"
          gh release create "$GITHUB_REF_NAME" \
            --title "mark1 edge v${VERSION}" \
            --notes "Edge binaries for five triples. Verify with \`mark1 verify-release\`: it checks the detached signature AND the SLSA provenance (repo, workflow, commit) before executing anything." \
            dist/pkg/* dist/sbom/*
      - name: Open the ring-0 manifest PR (09 §11.2 — a ring promotion is a reviewed commit)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#edge/v}"
          BRANCH="release/manifest-${VERSION}"
          # Announced, not silent: the manifest tooling (deploy/packaging/manifest) has not landed, and the
          # repo does not let Actions open PRs. Until both exist, ring 0 is promoted by hand.
          if [ ! -x deploy/packaging/manifest/bump.sh ]; then
            echo "::warning title=Ring-0 manifest not bumped::deploy/packaging/manifest/bump.sh does not exist yet; the release is published, ring-0 promotion for edge/v${VERSION} is a manual commit (09 §11.2)."
            exit 0
          fi
          git config user.name  "omium-release-bot"
          git config user.email "release@omium.ai"
          git checkout -b "$BRANCH"
          deploy/packaging/manifest/bump.sh --ring 0 --version "$VERSION" --artifacts dist/pkg
          git add deploy/packaging/manifest
          git commit -m "manifest: point ring 0 at edge/v${VERSION}"
          git push origin "$BRANCH"
          gh pr create --base main --head "$BRANCH" \
            --title "manifest: ring 0 -> edge/v${VERSION}" \
            --body "Monotonic manifest_seq bump pointing ring 0 (Omium dogfood) at edge/v${VERSION}. Ring 1/2 promotions are separate reviewed commits."
