# omium-mark1 CI — a thin matrix over the justfile recipes. THE JUSTFILE IS THE CI CONTRACT:
# every job below invokes a recipe a developer can run locally, so a gate that passes locally and
# fails here is a bug in the recipe, not in the environment.
#
# Branch protection on main requires exactly the checks in the machine-read block below.
# tools/ci/ci_matrix_gate.sh reads it and fails if a name here is not a check this workflow
# actually reports, or if a check this workflow reports is neither required nor consumed by a
# required job's `needs`. It listed `rust` and `go` for months; both are MATRIX jobs, so the
# checks GitHub reports are `rust (ubuntu-24.04)` and friends and no check named `rust` has ever
# existed. A required check that never reports does not gate anything — it is a name in a
# settings page that no run will ever satisfy.
#
# required-checks: gen, contracts, python, gates, trace-check, fuzz-smoke, integration,
#                  security, bench-gate, platform-gate
name: ci

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # Tool pins. A floating tool version is a statement about *time* (13 §9.5).
  GO_VERSION: "1.25.14"
  GOLANGCI_VERSION: "v2.1.6"
  BUF_VERSION: "1.72.0"          # justfile M1_BUF_VERSION is the only other copy
  GOVULNCHECK_VERSION: "v1.1.4"
  PIP_AUDIT_VERSION: "2.9.0"

jobs:
  # ---------------------------------------------------------------------------
  # Proto: the ratchet. Wired from the very first proto commit (13 §5.5).
  # ---------------------------------------------------------------------------
  gen:
    name: gen
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0          # buf breaking --against '.git#branch=main' needs history
      - uses: bufbuild/buf-setup-action@v1
        with:
          version: ${{ env.BUF_VERSION }}
          github_token: ${{ github.token }}
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - uses: extractions/setup-just@v2
      # buf.gen.yaml's betterproto plugin is `uv run --frozen protoc-gen-python_betterproto`
      # — a LOCAL plugin, deliberately, so plugin and runtime come from one uv.lock
      # resolution. This job had neither uv nor a synced env, so codegen died at
      # `exec: "uv": executable file not found` before generating a single file, and the
      # freshness gate reported that as a failure of the committed gen.
      - run: just build-py
      - run: just gen-check
      - run: just lint-proto

  # ---------------------------------------------------------------------------
  # The contract-sync rule (13 §10.3): a contract diff must carry its doc diff.
  # ---------------------------------------------------------------------------
  contracts:
    name: contracts
    runs-on: ubuntu-24.04
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: extractions/setup-just@v2
      - run: just contracts "${{ github.event.pull_request.base.sha }}"

  # ---------------------------------------------------------------------------
  # Three-OS coverage for Rust and Go is non-negotiable from day one: the edge ships to all
  # three and 04 §11.5 documents real per-OS SEMANTIC differences, not just build differences.
  # ---------------------------------------------------------------------------
  rust:
    name: rust (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-14, windows-2022]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable   # rust-toolchain.toml pins the actual channel
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - uses: extractions/setup-just@v2
      # 0.16.4 could not PARSE the current advisory DB (TOML error in RUSTSEC-2026-0066.md), so
      # the supply-chain gate was failing before it checked a single crate — a security gate that
      # is red for a reason unrelated to security is a gate nobody reads.
      - run: cargo install cargo-deny --locked --version 0.20.2
      - run: just lint-rust
      - run: just test-rust

  go:
    name: go (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    # 13 §3.5 calls CGO_ENABLED=0 load-bearing and says CI asserts it. Building under it, rather
    # than echoing its value, is what makes that an assertion: a dependency that needs cgo —
    # arriving transitively, as somebody else's default — fails `just build-go` here instead of
    # at the first release that tries to cross-compile a static binary out of it.
    env:
      CGO_ENABLED: "0"
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-14, windows-2022]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
      - uses: extractions/setup-just@v2
      - run: go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@${{ env.GOLANGCI_VERSION }}
      - run: go install golang.org/x/vuln/cmd/govulncheck@${{ env.GOVULNCHECK_VERSION }}
      - run: just build-go
      - run: just lint-go
      # cmd/phase2_gate_test.go IS the Phase 2 milestone, and it needs a real anchor binary on
      # PATH — it refuses to fake one, which is correct. Without ruff it t.Skip()s, the job exits
      # 0, and the milestone reported success by never running on any leg (D-CG). ruff comes from
      # uv.lock rather than a pin here, so the anchor is the same one lint-py resolves and there
      # is no second version to drift.
      #
      # ubuntu-only by SUBJECT, not convenience: macOS has no namespace sandbox
      # (anchors/sandbox_other.go returns UnavailableSandbox, so derivation is empty there
      # whatever is installed), and windows-2022 never compiles this //go:build unix package.
      - if: matrix.os == 'ubuntu-24.04'
        uses: astral-sh/setup-uv@v5
      - if: matrix.os == 'ubuntu-24.04'
        run: |
          uv sync --frozen --all-packages
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"
      # FR-VERIFY-002: the anchor sandbox (anchors/sandbox_linux.go) IS the security boundary, and
      # its in-sandbox probes skip on a kernel that refuses unprivileged user namespaces. The stock
      # ubuntu-24.04 image is that kernel: Ubuntu ≥ 23.10 ships
      # kernel.apparmor_restrict_unprivileged_userns=1 (24.04 release notes, "Unprivileged user
      # namespace restrictions"), and the image KEEPS it — runner-images
      # images/ubuntu/scripts/build/install-container-tools.sh grants `userns` to podman alone via
      # an AppArmor profile, and PR #11489 (lift it image-wide) was closed unmerged. An unconfined
      # Go test binary gets EPERM from clone(CLONE_NEWUSER), so every network-denial, AF_UNIX,
      # env-scrub, write-confinement and resource-kill probe t.Skip()ped and this job read green
      # on zero denials asserted (runner-images issue #10443). The VM is discarded after the job,
      # so lifting it here costs nothing; `unshare` proves it took before a single test runs, and
      # the lsm list shows whether Landlock (in Ubuntu's CONFIG_LSM since 5.13, LP #1950381) is
      # stacked on this kernel — the write-confinement probes need it and fail loudly if not.
      - if: matrix.os == 'ubuntu-24.04'
        name: Allow unprivileged user namespaces for the anchor sandbox probes
        run: |
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          unshare -Un true
          cat /sys/kernel/security/lsm; echo
      # M1_REQUIRE_STORES turns that skip into a failure. It is the existing gate for exactly this
      # shape — a suite whose external dependency is absent — and already covers a non-store
      # binary (receipts/integration_test.go gates `cargo` on it). Every other test that reads it
      # is //go:build integration, which test-go does not compile, so this changes the behaviour
      # of precisely one test.
      #
      # M1_REQUIRE_SANDBOX is the same inversion for the kernel features the sandbox needs: with
      # it set, anchors/sandbox_linux_test.go fails instead of skipping when userns or Landlock
      # is refused, and TestSandboxProbesNotVacuous asserts the probes actually executed. Linux
      # only by subject — the sandbox is //go:build linux; macOS and Windows have no probes to arm.
      - run: just test-go
        env:
          M1_REQUIRE_STORES: ${{ matrix.os == 'ubuntu-24.04' && '1' || '' }}
          M1_REQUIRE_SANDBOX: ${{ matrix.os == 'ubuntu-24.04' && '1' || '' }}

  # NFR-PORTABILITY-001's "any red platform blocks merge", made a single stable check name.
  # Requiring the six expanded matrix legs by name would work until the day someone adds a
  # seventh, which would then be un-required until a human edited a settings page — the platform
  # nobody gated would be the newly added one. `needs` is derived from the matrix, so a new leg
  # is covered the moment it exists. Same shape as bench-gate below, for the same reason.
  platform-gate:
    name: platform-gate
    runs-on: ubuntu-24.04
    needs: [rust, go]
    if: always()
    steps:
      - run: |
          set -eu
          echo "rust=${{ needs.rust.result }} go=${{ needs.go.result }}"
          fail=0
          for r in "${{ needs.rust.result }}" "${{ needs.go.result }}"; do
            [ "$r" = "success" ] || fail=1
          done
          if [ "$fail" -ne 0 ]; then
            echo "::error title=Platform matrix red::At least one of macOS/Linux/Windows failed or did not run. The edge ships to all three (04 §11.5 documents real per-OS SEMANTIC differences), so a red or absent platform is a merge blocker, not a known-flaky."
            exit 1
          fi
          echo "Rust and Go green on ubuntu-24.04, macos-14 and windows-2022."

  python:
    name: python
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - uses: extractions/setup-just@v2
      - run: |
          uv tool install "pip-audit==${PIP_AUDIT_VERSION}"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - run: just lint-py
      - run: just test-py

  # ---------------------------------------------------------------------------
  # The design-enforcing gates (13 §7.5) + cross-language conformance vectors.
  # ---------------------------------------------------------------------------
  gates:
    name: gates
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - uses: extractions/setup-just@v2
      # buf_breaking_gate.sh proves `buf breaking` can actually go red, so this job needs buf.
      # It hard-fails rather than skipping when $CI is set — a gate that reports "skipped"
      # while backing a requirement is the false green it exists to remove. No fetch-depth
      # bump: unlike lint-proto, that gate baselines against the WORKING TREE, not a git ref.
      - uses: bufbuild/buf-setup-action@v1
        with:
          version: ${{ env.BUF_VERSION }}
          github_token: ${{ github.token }}
      # verifier_offline_gate's blackhole mechanism runs the shipped verifier inside an
      # unprivileged network namespace (unshare -rn). The 24.04 image restricts that through
      # AppArmor, the gate reports PARTIAL, and under $CI a PARTIAL is a FAIL -- so this job was
      # red on run 35025349147 for the same kernel knob the go job lifts. Same lift, same reason.
      - name: Allow unprivileged user namespaces for the offline-verifier blackhole
        run: |
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          unshare -rn true
      - run: just gates
      - run: just conformance

  # Its own job, not a step in `gates`: 12 §10.3 makes this a required check in its own right,
  # and sharing a job would make its red indistinguishable from a broken OTel or build-tag gate.
  #
  # It is expected GREEN (D-CO). The 66 requirements armed and unproven today are carried in
  # conformance/traceability-debt.txt; check 4 reports those and fails only on an armed gap not
  # listed, or on a listed entry that is no longer one — so the baseline can only shrink. Checks
  # 1-3 (key-set drift, an evidence citation that stopped resolving, an evidence kind that
  # contradicts 02's Verification column) always fail. A permanently-red gate is one everybody
  # learns to scroll past, which fails the same way as a gate that cannot fail at all.
  trace-check:
    name: trace-check
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - uses: extractions/setup-just@v2
      - run: just trace-check

  fuzz-smoke:
    name: fuzz-smoke
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
      - uses: Swatinem/rust-cache@v2
      - uses: extractions/setup-just@v2
      - run: cargo install cargo-fuzz --locked --version 0.12.0
      - run: just fuzz 60

  # ---------------------------------------------------------------------------
  # Store-backed suites — the tenant-isolation lane. 12 §11.4 is normative:
  #   real stores on EVERY PR, provisioned as NATIVE BINARIES on the Linux runner.
  #   No Docker. No testcontainers. No service containers. No skip-if-absent.
  # M1_REQUIRE_STORES=1 inverts the estate's skipif idiom — a missing DSN is a hard error and the
  # required suites assert zero skips. The decorative-RLS incident was invisible precisely because
  # nothing ever executed against a real Postgres as the real role.
  # ---------------------------------------------------------------------------
  integration:
    name: integration
    runs-on: ubuntu-24.04
    env:
      M1_REQUIRE_STORES: "1"
      # These override the justfile's defaults, so they have to track them exactly — the store
      # contract lives at the top of the justfile and this block is its only other copy.
      M1_TEST_PG_DSN: postgres://mark1:mark1@127.0.0.1:5432/mark1_test
      # A second, privileged role for migrations only — m1_060 creates a BYPASSRLS role and PG16
      # lets only a BYPASSRLS role do that, while the suite role must NOT have it or no isolation
      # test can observe anything. Same split as prod's migration Job vs `*_app`.
      M1_MIGRATE_PG_DSN: postgres://m1_bootstrap@127.0.0.1:5432/mark1_test
      M1_TEST_CH_DSN: http://127.0.0.1:8123/?database=default
      M1_TEST_S3_ENDPOINT: http://127.0.0.1:9002
      # `just migrate` sends m1_ch_*.sql to a ClickHouse client and refuses to run at all without
      # CLICKHOUSE_HOST (scripts/migrate-db.sh §"ClickHouse lane"). What `stores-up` provisions is
      # the multi-call binary, not a `clickhouse-client` on PATH, so the command is several words
      # — migrate-db.sh reads it into an argv array, which is what makes that legal.
      #
      # Host and port are on argv, not in the environment: the pinned 24.8 client honours only
      # CLICKHOUSE_USER and CLICKHOUSE_PASSWORD from the environment (the binary contains no
      # other CLICKHOUSE_* name), so CLICKHOUSE_HOST alone would leave it on its localhost
      # default — right here by luck, wrong anywhere else. CLICKHOUSE_HOST is still set because
      # migrate-db.sh's precondition demands it before it will apply anything.
      CLICKHOUSE_HOST: "127.0.0.1"
      CLICKHOUSE_CLIENT: ".stores/bin/clickhouse client --host 127.0.0.1 --port 9000"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - uses: extractions/setup-just@v2
      # 12 §11.1 stage 2e. Store-free — it rides in this job because this job is Linux-only and
      # already required BY NAME, and D-CS is what that buys: a new required check gates nothing
      # until a human edits a settings page, so the check that exists is worth more than the one
      # that is correct on paper. Before stores-up so a spool durability failure is not reported
      # as a store-provisioning flake.
      - name: chaos-fast (⚡ set)
        run: just test-chaos
      - name: Provision Postgres + ClickHouse + MinIO as native binaries
        run: just stores-up
      - name: Migrate (idempotency asserted by applying twice)
        run: |
          just migrate "$M1_MIGRATE_PG_DSN"
          just migrate "$M1_MIGRATE_PG_DSN"
      - run: just test-integration
      - run: just test-isolation
      - name: Store logs on failure
        if: failure()
        run: tail -n 200 .stores/log/*.log || true

  security:
    name: security
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # The CLI, not gitleaks-action@v2. The action requires a paid license for
      # organisation repos and fails with `🛑 missing gitleaks license` before
      # scanning anything — so from the first commit until this change, secret
      # scanning on this repo had never once executed while the job reported a
      # red nobody read (D-BA). The CLI is MIT and has no license gate.
      # Pinned by version AND sha256: an unpinned scanner is a supply-chain hole
      # in the job whose entire purpose is supply-chain hygiene.
      - name: gitleaks (full history)
        run: |
          set -euo pipefail
          ver=8.18.4
          sha=ba6dbb656933921c775ee5a2d1c13a91046e7952e9d919f9bac4cec61d628e7d
          curl -fsSL -o gl.tgz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${ver}/gitleaks_${ver}_linux_x64.tar.gz"
          echo "${sha}  gl.tgz" | sha256sum -c -
          tar xzf gl.tgz gitleaks
          # --redact so a real finding does not print the secret into a public log.
          ./gitleaks detect --source . --config .gitleaks.toml --redact --no-banner
      - name: hadolint every Dockerfile
        run: |
          set -euo pipefail
          curl -fsSL -o /usr/local/bin/hadolint \
            https://github.com/hadolint/hadolint/releases/download/v2.12.0/hadolint-Linux-x86_64
          chmod +x /usr/local/bin/hadolint
          find . -name Dockerfile -not -path './.git/*' -print0 | xargs -0 -r hadolint

  # ---------------------------------------------------------------------------
  # Benchmarks. 12 §7.1's absolute budgets are only meaningful on the pinned runner class
  # (bench/RUNNER.md); GitHub-hosted numbers have variance that is not ours to control.
  #
  # The runner is a real machine somebody has to own. Until it exists — or on any day it is
  # down — this stage DEFERS to the mandatory pre-release bench in release.yml and says so
  # loudly. It is never silently skipped, and it never blocks every merge in the repo on the
  # liveness of one unowned box. Set the repo variable MARK1_BENCH_RUNNER to the runner's label
  # to arm the gating lane; clear it to disarm.
  # ---------------------------------------------------------------------------
  bench:
    name: bench
    if: vars.MARK1_BENCH_RUNNER != ''
    runs-on: [self-hosted, "${{ vars.MARK1_BENCH_RUNNER }}"]
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: extractions/setup-just@v2
      - run: just bench

  bench-deferred:
    name: bench-deferred
    if: vars.MARK1_BENCH_RUNNER == ''
    runs-on: ubuntu-24.04
    steps:
      - name: Announce the deferral loudly
        run: |
          set -eu
          MSG="BENCHMARKS DEFERRED: no pinned bench runner is configured (repo variable
          MARK1_BENCH_RUNNER is empty). 12 §7.1's latency/throughput budgets are NOT checked on
          this PR. They WILL be checked, mandatorily and without a fallback, by the 'bench'
          job in release.yml before any artifact is published — a regression cannot ship, it
          can only merge and then block the release."
          echo "::warning title=Benchmarks deferred to release::${MSG}"
          {
            echo "### :hourglass: Benchmarks deferred"
            echo
            echo "${MSG}"
            echo
            echo "Owner action: provision the pinned runner class (see \`bench/RUNNER.md\`),"
            echo "register it self-hosted, and set repo variable \`MARK1_BENCH_RUNNER\`."
          } >> "$GITHUB_STEP_SUMMARY"

  # The single required check for the bench stage: red when a benchmark actually regressed,
  # green when it ran clean or was explicitly deferred — and red if neither happened, so
  # "both jobs skipped" can never masquerade as a pass.
  bench-gate:
    name: bench-gate
    runs-on: ubuntu-24.04
    needs: [bench, bench-deferred]
    if: always()
    steps:
      - run: |
          set -eu
          echo "bench=${{ needs.bench.result }} bench-deferred=${{ needs.bench-deferred.result }}"
          case "${{ needs.bench.result }}" in
            success) echo "Benchmarks ran on the pinned runner and met 12 §7.1's budgets."; exit 0 ;;
            failure) echo "::error title=Benchmark regression::A gated benchmark exceeded its budget. There is no perf-waiver label (12 §7.3): raise the budget in 02 and 12 in its own PR, or fix the regression."; exit 1 ;;
          esac
          if [ "${{ needs.bench-deferred.result }}" != "success" ]; then
            echo "::error title=Bench stage did not run::Neither the pinned-runner bench nor the deferral notice completed. The stage must never be silently absent."
            exit 1
          fi
          echo "Benchmarks deferred to the mandatory pre-release run in release.yml."
